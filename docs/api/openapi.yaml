    OrganizationOperationalCalendarVersionRequest:
      type: object
      additionalProperties: false
      required: [timeZone, operationalDayStart, effectiveFrom]
      properties:
        timeZone:
          type: string
          minLength: 1
          maxLength: 64
          description: IANA time-zone identifier used by the network default.
        operationalDayStart:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Local wall-clock time in HH:mm; no default is assumed.
        effectiveFrom:
          type: string
          format: date
          description: Inclusive operational date for this immutable version.
    OrganizationOperationalCalendarVersion:
      type: object
      additionalProperties: false
      required: [id, timeZone, operationalDayStart, effectiveFrom, createdBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        timeZone:
          type: string
        operationalDayStart:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        effectiveFrom:
          type: string
          format: date
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    OrganizationOperationalCalendar:
      type: object
      additionalProperties: false
