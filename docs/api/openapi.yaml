    get:
      operationId: listStoreSalesCoverage
      summary: List declared complete sales periods for a store
      description: >-
        An administrator, manager, operator, or buyer assigned to this store
        may read periods. A product/day without a row counts as zero only for
        dates in declared complete periods and while the assortment was active.
      tags: [Replenishment]
