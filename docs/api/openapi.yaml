          type: string
          minLength: 32
          maxLength: 128
          writeOnly: true
        fullName:
          type: string
          minLength: 2
          maxLength: 160
          description: Required only when the invited email does not yet have an account.
        password:
          type: string
          format: password
          writeOnly: true
          maxLength: 256
          description: Required only when the invited email does not yet have an account.
    InvitationAcceptResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [accepted, second_factor_required, second_factor_enrollment_required]
        organizationId:
          type: string
          format: uuid
        challengeId:
          type: string
          format: uuid
        methods:
          type: array
          items:
            type: string
            enum: [webauthn, recovery_code]
        membership:
          $ref: '#/components/schemas/NetworkMembershipRecord'
        createdAccount:
          type: boolean
    RegistrationRequest:
      type: object
      additionalProperties: false
      required: [organizationName, administratorName, email, password]
      properties:
        organizationName:
          type: string
          minLength: 2
          maxLength: 160
          description: Name of the network; length bounds are provisional.
        administratorName:
          type: string
          minLength: 2
          maxLength: 160
          description: Administrator's name; length bounds are provisional.
        email:
          type: string
          format: email
          maxLength: 254
          description: Email syntax/length validation is provisional.
        password:
          type: string
          format: password
          writeOnly: true
          description: Password policy and validation limits remain to be decided.
    RegistrationAccepted:
      description: Provisional response representation.
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          const: confirmation_required
        message:
          type: string
          description: Localized message suitable for display to the user.
    Problem:
      description: Provisional error envelope; codes, fields, and localization contract remain to be decided.
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
          description: Safe, localized summary that does not expose secrets.
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    SessionAuthenticated:
      description: >-
        Successful authenticated state. The credential is in the server-side
        session cookie, never in a response body. This schema is returned only
        after email confirmation and all role-required factors are complete.
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: authenticated
    CurrentSession:
      description: >-
        Provisional session-context representation. Organizations contains
        only active memberships; activeOrganizationId is null when no context
        has been selected or the user has no active membership.
      type: object
      additionalProperties: false
      required: [status, activeOrganizationId, organizations]
      properties:
        status:
          type: string
          enum: [authenticated, organization_selection_required]
        activeOrganizationId:
          type: [string, 'null']
          format: uuid
          description: Selected server-side context; not an authorization credential.
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationMembership'
    OrganizationMembership:
      type: object
      additionalProperties: false
      required: [id, name, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          description: Role from the active membership; exact serialized role values are provisional.
    OrganizationSelectionRequest:
      description: Organization ID is a context selection request, not authority.
      type: object
      additionalProperties: false
      required: [organizationId]
      properties:
        organizationId:
          type: string
          format: uuid
          description: Must identify an active membership owned by the authenticated user.
    OrganizationUnavailable:
      description: Generic response for any organization that cannot be selected by this user.
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          const: organization_unavailable
        message:
          type: string
          description: Same generic wording for unknown organizations and missing active memberships.
    MfaRequired:
      description: >-
        Pre-authentication state only. It has no session cookie and cannot
        access any application operation. The challenge is bound to the user
        and purpose, expires after 10 minutes, and allows at most five failed
        verification attempts.
      type: object
      additionalProperties: false
      required: [status, challengeId, methods]
      properties:
        status:
          type: string
          const: second_factor_required
        challengeId:
          type: string
          format: uuid
          description: Opaque reference to a short-lived server-side challenge; not an access token.
        methods:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [webauthn, recovery_code]
    MfaEnrollmentRequired:
      description: >-
        Pre-authentication state for a privileged account without an enrolled
        WebAuthn credential or unused recovery code. No application session is
        created until enrollment has been verified. The challenge expires
        after 10 minutes and allows at most five failed verification attempts.
      type: object
      additionalProperties: false
      required: [status, challengeId, methods]
      properties:
        status:
          type: string
          const: second_factor_enrollment_required
        challengeId:
          type: string
          format: uuid
          description: Opaque, short-lived enrollment reference; not an access token.
        methods:
          type: array
          items:
            type: string
            const: webauthn
    PreAuthChallengeRequest:
      type: object
      additionalProperties: false
      required: [challengeId]
      properties:
        challengeId:
          type: string
          format: uuid
    WebAuthnOptions:
      description: >-
        WebAuthn PublicKeyCredentialCreationOptions or
        PublicKeyCredentialRequestOptions. The server validates the challenge,
        configured RP ID and allowed origins, credential signature, replay
        state, and required user verification.
      type: object
      additionalProperties: true
    WebAuthnVerificationRequest:
      description: >-
        WebAuthn registration or assertion response plus the opaque pre-auth
        challenge reference. The server validates challenge, origin, RP ID,
        user verification, credential signature, and replay state.
      type: object
      additionalProperties: false
      required: [challengeId, credential]
      properties:
        challengeId:
          type: string
          format: uuid
        credential:
          type: object
          additionalProperties: true
    MfaEnrollmentComplete:
      description: >-
        Returned once after successful first-factor enrollment. Ten
        single-use recovery codes are displayed a single time; only their
        password hashes are stored server-side.
      type: object
      required: [status, recoveryCodes]
      properties:
        status:
          type: string
          const: authenticated
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
    ActiveOrganizationRequired:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          const: active_organization_required
        message:
          type: string
    ResourceUnavailable:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          const: resource_unavailable
        message:
          type: string
          description: Generic wording for unknown and cross-organization resource IDs.
    OperationalCalendarRequired:
