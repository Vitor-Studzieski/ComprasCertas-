      description: >-
        Administrator-only. Store ownership is checked against the validated
        active organization. Returns active and historical links so ending a
        range never removes its audit history. Validity uses the half-open
        interval [effectiveFrom, effectiveTo): the start is inclusive and the
        optional end is exclusive.
      tags: [Inventory]
      security:
        - SessionCookie: []
