    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/AssortmentId'
    patch:
      operationId: closeStoreProductAssortment
      summary: End a store-product assortment link
      description: >-
        Administrator-only. Sets the exclusive effectiveTo date for an
        open-ended link, retaining the row and its audit history rather than
        deleting it. effectiveTo must be later than effectiveFrom. The server
        verifies the store and link belong to the validated active
        organization and records the acting administrator and server time.
      tags: [Inventory]
