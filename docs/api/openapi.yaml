openapi: 3.1.0
info:
  title: CompraCerta API
  version: 0.1.0
  summary: Draft contract for the first online foundation.
  description: |
    Draft contract for the first online cycle. All endpoint paths, status
    codes, payload shapes, validation limits, error representation, and
    session representation below are provisional pending technical review.
    Approved product rules: signup collects the network name, administrator
    name/email, and password; email confirmation is required before any
    operation; the 30-day trial starts after successful confirmation; signup
    does not collect CNPJ, address, or payment details. Network administrators
    and users who approve orders or stock adjustments must complete an
    architecture-approved second factor before receiving an authenticated
    session.
servers:
  - url: /api/v1
    description: Versioned API base path
paths:
  /health/:
    get:
      operationId: getHealth
      summary: Check API availability (draft)
      description: Provisional route and response shape; the exact health-check semantics remain to be decided.
      tags: [System]
      security: []
      responses:
        '200':
          description: API is available.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /registrations/:
    post:
      operationId: createRegistration
      summary: Start a network's self-service registration
      description: |
        Provisional route, request/response shape, and pre-confirmation state.
        This draft proposes creating a pending organization and administrator
        membership and sending an email confirmation link. That transient
        state and its persistence timing are technical choices for review.
        Email confirmation is required before any operation; the 30-day trial
        begins only after successful confirmation. Signup must not collect
        CNPJ, address, or payment details.
      tags: [Identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '202':
          description: Registration accepted; confirmation is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationAccepted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: >-
            Provisional conflict response. The conditions and status code are
            undecided; review account-enumeration risk for duplicate email or
            organization data before fixing this behavior.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /email-confirmations/:
    post:
      operationId: confirmEmail
      summary: Confirm an administrator's email address
      description: |
        Email confirmation is required before any operation. Successful
        confirmation verifies the administrator's email and starts the
        network's 30-day trial. The POST route and token-in-request-body shape
        are provisional. Single-use and expiration rules, token lifetime, and
        response statuses are pending technical/security review. Confirmation
        alone does not bypass any required MFA before an authenticated session
        is issued.
      tags: [Identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 1
                  description: >-
                    Provisional representation of the token received through
                    the confirmation link; token transport and constraints are
                    pending review.
      responses:
        '200':
          description: Email confirmed and trial started.
          content:
            application/json:
              schema:
                type: object
                required: [status, trialStartsAt, trialEndsAt]
                properties:
                  status:
                    type: string
                    const: confirmed
                  trialStartsAt:
                    type: string
                    format: date-time
                  trialEndsAt:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/ValidationError'
        '410':
          description: >-
            Provisional response for an invalidated token; expiry, reuse
            behavior, and status code are pending review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /email-confirmations/resend/:
    post:
      operationId: resendEmailConfirmation
      summary: Resend the confirmation email
      description: |
        Provisional route, request/response shape, and account-enumeration
        behavior. This draft proposes a generic response that does not reveal
        whether the email is registered or already confirmed. Rate limiting
        details are also pending review.
      tags: [Identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Request accepted.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: accepted
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /sessions/:
    post:
      operationId: createSession
      summary: Sign in with email and password
      description: |
        Provisional route and session representation. A confirmed email is
        required before any operation; credentials for an unconfirmed account
        must not create an authenticated session. Email/password alone must not
        create an authenticated session for a network administrator or a user
        who approves orders or stock adjustments. Those roles must complete an
        architecture-approved second factor: passkey/Windows Hello or a
        security key; one-time recovery codes are also approved recovery
        factors. No provider or protocol is selected here. If no required
        factor is enrolled, return a non-authenticated enrollment-required
        state; the enrollment route and representation remain pending. The
        access-token/session format, refresh/revocation semantics, status codes,
        and challenge representation are provisional.
      tags: [Identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  writeOnly: true
      responses:
        '200':
          description: >-
            Provisional result. `authenticated` is returned only after email
            confirmation and all factors required for the account's roles have
            been completed. A pending MFA state does not grant access.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SessionAuthenticated'
                  - $ref: '#/components/schemas/MfaRequired'
                  - $ref: '#/components/schemas/MfaEnrollmentRequired'
        '401':
          description: >-
            Provisional response for invalid credentials or unconfirmed email;
            response semantics and anti-enumeration behavior are pending review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /sessions/mfa/verify/:
    post:
      operationId: verifySessionFactor
      summary: Complete a required second factor (draft)
      description: |
        Provisional route and representation for completing login with an
        already enrolled factor. Only architecture-approved methods are
        represented: passkey/Windows Hello, security key, or a one-time
        recovery code. The opaque proof shape intentionally does not select a
        provider or authentication protocol. A successful response may issue
        an authenticated session only after confirmation and all required
        factors; recovery codes are consumed once. Factor enrollment for a
        newly registered administrator is not specified by this draft and
        must be defined before that account can receive an authenticated
        session.
      tags: [Identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerificationRequest'
      responses:
        '200':
          description: Factor verified; response/session shape is provisional.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAuthenticated'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Factor proof could not be verified; response is provisional.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  responses:
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Provisional rate-limit response and representation.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds before retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    RegistrationRequest:
      type: object
      additionalProperties: false
      required: [organizationName, administratorName, email, password]
      properties:
        organizationName:
          type: string
          minLength: 2
          maxLength: 160
          description: Name of the network; length bounds are provisional.
        administratorName:
          type: string
          minLength: 2
          maxLength: 160
          description: Administrator's name; length bounds are provisional.
        email:
          type: string
          format: email
          maxLength: 254
          description: Email syntax/length validation is provisional.
        password:
          type: string
          format: password
          writeOnly: true
          description: Password policy and validation limits remain to be decided.
    RegistrationAccepted:
      description: Provisional response representation.
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          const: confirmation_required
        message:
          type: string
          description: Localized message suitable for display to the user.
    Problem:
      description: Provisional error envelope; codes, fields, and localization contract remain to be decided.
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
          description: Safe, localized summary that does not expose secrets.
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    SessionAuthenticated:
      description: >-
        Provisional session representation. Issued only after email confirmation
        and any role-required factors have completed. Token type, security
        scheme, expiry, and refresh behavior remain undecided.
      type: object
      required: [status, accessToken, expiresAt]
      properties:
        status:
          type: string
          const: authenticated
        accessToken:
          type: string
          description: Placeholder credential; token format and transport are pending review.
        expiresAt:
          type: string
          format: date-time
          description: Provisional expiry representation.
    MfaRequired:
      description: >-
        Provisional non-authenticated state. It must not contain an access
        token or otherwise permit operations before required MFA is complete.
      type: object
      additionalProperties: false
      required: [status, challengeId, methods]
      properties:
        status:
          type: string
          const: second_factor_required
        challengeId:
          type: string
          description: Provisional challenge reference; representation is pending review.
        methods:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [passkey_windows_hello, security_key, recovery_code]
    MfaEnrollmentRequired:
      description: >-
        Provisional non-authenticated state for a privileged account without
        an enrolled factor. Enrollment route, protocol, and representation
        remain pending; no access is granted in this state.
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: second_factor_enrollment_required
    MfaVerificationRequest:
      description: Provisional request; route and proof schema are pending review.
      type: object
      additionalProperties: false
      required: [challengeId, method, proof]
      properties:
        challengeId:
          type: string
        method:
          type: string
          enum: [passkey_windows_hello, security_key, recovery_code]
        proof:
          type: object
          additionalProperties: true
          description: Opaque factor proof; exact representation is not specified.
