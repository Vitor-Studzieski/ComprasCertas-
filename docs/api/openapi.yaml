          type: string
        contactName:
          type: string
        email:
          type: string
        phone:
          type: string
        notes:
          type: string
        isActive:
          type: boolean
        createdBy:
          type: string
          format: uuid
        updatedBy:
          type: string
          format: uuid
        createdAt:
