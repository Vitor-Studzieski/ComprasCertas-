  /suppliers/{supplierId}/product-conditions/:
    parameters:
      - $ref: '#/components/parameters/SupplierId'
    get:
      operationId: listSupplierProductConditions
      summary: List purchasing conditions for a supplier
      description: >-
        Administrators and buyers only. Conditions are immutable, effective-
        dated versions. With no storeId, administrators receive all scopes;
        buyers receive only shared network conditions. Supplying storeId is
        administrator-only until explicit store assignments are implemented.
        Administrators with a storeId receive shared network conditions and
        overrides for that store. Delivery lead time is measured in calendar
        days.
      tags: [Catalog]
      security:
        - SessionCookie: []
      parameters:
        - name: productId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: storeId
          in: query
          required: false
          description: Administrator-only; when supplied, include shared conditions and this store's overrides.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Purchasing conditions for the supplier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierProductConditionList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/CatalogAccessRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
    post:
      operationId: createSupplierProductCondition
      summary: Add an effective-dated purchasing condition
      description: >-
        Administrators and buyers only. A missing or null storeId creates a
        shared network condition; administrators may supply a storeId to
        create an override. Buyers are limited to shared conditions until
        explicit store assignments are implemented; supplying storeId as a
        buyer returns catalog_store_access_required. Conditions are
        append-only: effectiveFrom must be later than the latest version for
        the same supplier, product, and scope. Delivery lead time uses
        calendar days. MOQ and purchaseMultiple are expressed in
        purchaseUnitName; baseUnitsPerPurchaseUnit converts that unit into the
        product's stock base unit. Quantities are exact decimal strings, and
        countable products require whole-number conversion and quantities.
      tags: [Catalog]
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierProductConditionCreateRequest'
