openapi: 3.1.0
info:
  title: CompraCerta API
  version: 0.1.0
  summary: Draft contract for the first online foundation.
  description: |
    Draft contract for the first online cycle. Route details, status codes,
    token lifetime, WebAuthn RP ID/origins, and validation limits remain
    provisional. Approved product rules: signup collects network name,
    administrator name/email, and password; email confirmation is required
    before operating; the 30-day trial starts at confirmation; no CNPJ,
    address, or payment details are collected at signup. A global user may
    join another network only through a separate invitation. Administrators
    and people who approve orders or stock adjustments must complete MFA
    before an authenticated session is issued. The technical draft uses
    WebAuthn and server-side Django sessions; it does not use bearer/JWT tokens.
    Tenant-scoped inventory endpoints use the validated active organization
    from that session. They accept no organizationId authority from the client;
    initial inventory writes and store endpoints are administrator-only;
    product reads and supplier catalog operations permit administrators and
    buyers, with buyers limited to network-wide supplier conditions until
    store access assignments exist. Browser writes require CSRF. A tenant
    operation is unavailable until an active
    organization is selected when the user has multiple memberships. Before a
    store can record sales or perform stock operations, it must resolve an
    effective IANA time zone and operational-day start from the network or a
    store override; no implicit start-time default is used. Missing calendar
    configuration blocks the operation with 409 operational_calendar_required.
    After calendar setup, an administrator may record the store's initial
    physical stock count as audited opening movements. Products can be linked
    to network-owned categories. Deterministic replenishment uses the previous
    30 complete operational dates, excludes explicitly recorded out-of-stock
    dates, and marks incomplete evidence. Expected deliveries, budgets, and
    freight values are not represented in this increment; recommendations
    disclose those limitations.
servers:
  - url: /api/v1
    description: Versioned API base path
paths:
  /health/:
    get:
      operationId: getHealth
      summary: Check API availability (draft)
      description: Provisional route and response shape; the exact health-check semantics remain to be decided.
      tags: [System]
      security: []
      responses:
        '200':
          description: API is available.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /registrations/:
    post:
      operationId: createRegistration
      summary: Start a network's self-service registration
      description: |
        Creates only a pending registration intent and sends an email
        confirmation link; it does not create a usable organization or
        membership. On confirmation, the backend creates the global user,
        organization, active administrator membership, and 30-day trial in one
        transaction. The trial starts at the confirmation time and no session
        is issued by confirmation. The email link expires 24 hours after issue;
        resending creates another valid link without invalidating earlier links
        that have not expired. The token is carried in the URL fragment and the
        client sends it to the confirmation endpoint in the request body. An
        email that already belongs to a global account cannot self-create
        another network; additional memberships require an invitation. The
        response is generic for new and existing accounts to reduce account
        enumeration. Route and payload details remain provisional.
      tags: [Identity]
      security:
        - CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '202':
          description: >-
            Generic response for an eligible registration request. The same
            response is used when the email already belongs to an account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationAccepted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /email-confirmations/:
    post:
      operationId: confirmEmail
      summary: Confirm an administrator's email address
      description: |
        Email confirmation is required before operating. Successful
        confirmation verifies the email and atomically creates the global user,
        organization, active administrator membership, and 30-day trial. The
        trial starts at the confirmation timestamp and ends exactly 30 days
        later. Confirmation does not issue a session; the administrator must
        sign in and complete MFA enrollment first. The implementation accepts
        the one-time token from the email link's URL fragment and expires each
        issued token after 24 hours. Invalid, expired, and already-used tokens
        receive the same response. A repeated confirmation must not create
        duplicate organizations or trials.
      tags: [Identity]
      security:
        - CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 1
                  description: One-time token extracted by the client from the email link fragment.
      responses:
        '200':
          description: >-
            Email confirmed, organization and administrator membership created,
            and 30-day trial started. No authenticated session is created.
          content:
            application/json:
              schema:
                type: object
                required: [status, trialStartsAt, trialEndsAt]
                properties:
                  status:
                    type: string
                    const: confirmed
                  trialStartsAt:
                    type: string
                    format: date-time
                  trialEndsAt:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/ValidationError'
        '410':
          description: >-
            Token is invalid, expired, or already used. The response does not
            distinguish these states.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /email-confirmations/resend/:
    post:
      operationId: resendEmailConfirmation
      summary: Resend the confirmation email
      description: |
        Sends a generic message that does not disclose whether the email is
        registered, pending, or already confirmed. For an existing account,
        any additional network membership still requires a separate invitation.
        Rate-limit values remain provisional. Each resend creates an additional
        24-hour token; previously issued, unexpired tokens remain usable.
      tags: [Identity]
      security:
        - CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Request accepted.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: accepted
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /csrf/:
    get:
      operationId: getCsrfToken
      summary: Obtain a CSRF token for browser requests
      description: >-
        Provisional bootstrap endpoint. Browser clients call this before
        registration, email confirmation, login, or other unsafe requests.
        The response sets Django's CSRF cookie and returns the masked token;
        browser clients send that token in X-CSRFToken on unsafe requests. The
        API validates it with Django CSRF protection, including on anonymous
        login requests. The client includes credentials for same-origin calls.
      tags: [Security]
      security: []
      responses:
        '200':
          description: CSRF cookie and token issued.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Django CSRF cookie; not an authentication session.
          content:
            application/json:
              schema:
                type: object
                required: [csrfToken]
                properties:
                  csrfToken:
                    type: string
  /sessions/:
    post:
      operationId: createSession
      summary: Sign in with email and password
      description: |
        Provisional route and response representation. The email must be
        confirmed. A global user with any active administrator, store manager,
        or buyer membership must complete MFA before a session is issued. If no factor
        is enrolled, return an enrollment-required pre-authentication state;
        otherwise return an authentication-required pre-authentication state.
        Neither state is an application session. A session is created only
        after all required factors pass. A browser with an existing session
        must sign out before starting a different login. Sessions are
        server-side Django sessions carried in a Secure, HttpOnly, SameSite
        cookie. A session without a completed MFA ceremony cannot access
        protected application operations while the account has any active
        privileged membership, including after a role change. Unsafe browser
        requests use an explicit CSRF token. RP ID and allowed origins are
        deployment configuration.
      tags: [Identity]
      security:
        - CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  writeOnly: true
      responses:
        '200':
          description: >-
            Password accepted. The response is one of: authenticated (only
            when MFA is not required), second_factor_required, or
            second_factor_enrollment_required. A session cookie is set only
            for the authenticated state; pre-authentication states do not set
            an application session.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: >-
                Secure, HttpOnly, SameSite server-side session cookie; present
                only when the response status is authenticated.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SessionAuthenticated'
                  - $ref: '#/components/schemas/MfaRequired'
                  - $ref: '#/components/schemas/MfaEnrollmentRequired'
        '401':
          description: Invalid credentials or unconfirmed email; details are generic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: An authenticated browser must sign out before another login.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /sessions/mfa/enrollment/options/:
    post:
      operationId: createMfaEnrollmentOptions
      summary: Begin WebAuthn enrollment for a privileged account
      description: >-
        Uses the short-lived pre-authentication challenge returned by password
        login. The challenge expires after 10 minutes and allows at most five
        failed verification attempts. This does not create an application
        session. User verification is required. RP ID, allowed origins, and
        timeout are deployment configuration.
      tags: [Identity]
      security:
        - CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreAuthChallengeRequest'
      responses:
        '200':
          description: WebAuthn credential-creation options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnOptions'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Challenge invalid, expired, or already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /sessions/mfa/enrollment/verify/:
    post:
      operationId: verifyMfaEnrollment
      summary: Verify and save a new WebAuthn credential
      description: >-
        The server verifies the WebAuthn registration response against the
        stored challenge, expected origin and RP ID, and required user
        verification. On success, it stores public credential data, issues
        the first session, and returns ten recovery codes once. Only password
        hashes of the recovery codes are stored. Private key material is never
        sent to or stored by CompraCerta.
      tags: [Identity]
      security:
        - CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnVerificationRequest'
      responses:
        '200':
          description: Enrollment verified; session cookie issued and recovery codes shown once.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Secure, HttpOnly, SameSite server-side session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrollmentComplete'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Challenge or WebAuthn response could not be verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /sessions/mfa/authentication/options/:
    post:
      operationId: createMfaAuthenticationOptions
      summary: Begin WebAuthn verification during login
      description: >-
        Uses a short-lived, single-use challenge. The challenge expires after
        10 minutes and allows at most five failed verification attempts.
        User verification is required for the assertion.
      tags: [Identity]
      security:
        - CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreAuthChallengeRequest'
      responses:
        '200':
          description: WebAuthn assertion options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnOptions'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Challenge invalid, expired, or already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /sessions/mfa/authentication/verify/:
    post:
      operationId: verifyMfaAuthentication
      summary: Verify a WebAuthn assertion and create a session
      tags: [Identity]
      security:
        - CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnVerificationRequest'
      responses:
        '200':
          description: MFA verified and server-side session cookie issued.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Secure, HttpOnly, SameSite server-side session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAuthenticated'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Challenge or WebAuthn response could not be verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /sessions/mfa/recovery-code/:
    post:
      operationId: verifyRecoveryCode
      summary: Use a one-time recovery code during login
      description: >-
        The recovery code is consumed atomically and cannot be reused. The
        challenge expires after 10 minutes and allows at most five failed
        verification attempts.
      tags: [Identity]
      security:
        - CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challengeId, recoveryCode]
              properties:
                challengeId:
                  type: string
                  format: uuid
                recoveryCode:
                  type: string
                  writeOnly: true
      responses:
        '200':
          description: Recovery code accepted and server-side session cookie issued.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Secure, HttpOnly, SameSite server-side session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAuthenticated'
        '401':
          description: Recovery code is invalid, expired, or already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /sessions/current/:
    get:
      operationId: getCurrentSession
      summary: Read the current session and its active organizations
      description: >-
        Returns the authenticated state, the active organization selected for
        this session (if any), and the user's active memberships. If the user
        has one active membership, the server may select it automatically. If
        there are multiple active memberships and none is selected, status is
        organization_selection_required and no tenant-scoped API operation is
        allowed until selection. With no active memberships, organizations is
        empty and no tenant operation is available. Organization context is
        not authority: every tenant operation still checks membership, role,
        and store scope on the server.
      tags: [Identity]
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Authenticated session state and active membership context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentSession'
        '403':
          description: No authenticated session or required MFA assurance is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      operationId: deleteCurrentSession
      summary: Sign out of the current session
      tags: [Identity]
      security:
        - SessionCookie: []
          CsrfHeader: []
      responses:
        '204':
          description: Session invalidated.
        '403':
          description: No active session.
  /sessions/current/organization/:
    put:
      operationId: setCurrentOrganization
      summary: Select the active organization for this session
      description: >-
        Accepts an organization ID only as a selection request. The server
        must verify that the authenticated user has an active membership in
        that organization and must save the selection in the server-side
        session only after that check. The ID does not grant authority; each
        tenant operation continues to enforce membership, role, MFA, and store
        scope. If there are multiple active memberships, tenant-scoped API
        operations remain unavailable until a valid selection is saved. An
        organization that does not exist, is not an active membership, or is
        otherwise not selectable receives the same generic response.
      tags: [Identity]
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationSelectionRequest'
      responses:
        '200':
          description: Active organization selected for this session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentSession'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: No authenticated session or required MFA assurance is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: >-
            Organization is unavailable or is not an active membership for
            this user. The response is identical for an unknown organization,
            a missing membership, or an invalid selection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUnavailable'

  /organizations/current/operational-calendar/:
    get:
      operationId: listOrganizationOperationalCalendarVersions
      summary: List the network's operational-calendar defaults
      description: >-
        Administrator-only. The organization is resolved from the validated
        active session; this path does not accept an organization ID. Returns
        all date-effective default versions with their audit actor and server
        timestamp. If none are configured, versions is empty.
      tags: [Inventory]
      security:
        - SessionCookie: []
      responses:
        '200':
          description: All operational-calendar default versions for the active organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationOperationalCalendar'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
          $ref: '#/components/responses/ActiveOrganizationRequired'
  /organizations/current/operational-calendar/versions/:
    post:
      operationId: createOrganizationOperationalCalendarVersion
      summary: Append a network operational-calendar default version
      description: >-
        Administrator-only. Resolves the organization from the validated
        active session. Adds a date-effective version; existing versions and
        their audit records are not overwritten or deleted. effectiveFrom is
        inclusive and is an operational date. The organization must provide
        both a time zone and a local operational-day start; no start time is
        hard-coded. The first version may use today or an earlier date only
        while no sales, stock movements/counts, or purchasing/budget
        transactions exist; otherwise it must be after the current operational
        date. Every later version must be later than the newest recorded
        version and after the current operational date for every store,
        calculated using the network default and each store's effective
        calendar. This subsequent-version rule applies even when no stock
        movements exist.
      tags: [Inventory]
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationOperationalCalendarVersionRequest'
      responses:
        '201':
          description: New immutable calendar version recorded with server-side audit metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationOperationalCalendarVersion'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
          $ref: '#/components/responses/ActiveOrganizationRequired'
        '409':
          $ref: '#/components/responses/OperationalCalendarVersionConflict'
  /stores/:
    get:
      operationId: listStores
      summary: List stores in the active organization
      description: >-
        Administrator-only. The organization is derived from the validated
        active session. Each store reports its current explicit overrides and
        the effective calendar resolved field by field from those overrides
        and the network defaults. effectiveCalendar is null while a required
        value cannot be resolved.
      tags: [Inventory]
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Stores belonging to the active organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreList'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
          $ref: '#/components/responses/ActiveOrganizationRequired'
    post:
      operationId: createStore
      summary: Create a store
      description: >-
        Administrator-only. The organization is derived from the validated
        active session. No organizationId is accepted. calendarOverrides is
        optional; omitted fields inherit the network's corresponding default.
        If supplied, effectiveFrom is inclusive and creates an immutable
        store-calendar version with audit metadata. An initial override may
        use today or an earlier operational date only before sales, stock
        movements/counts, or purchasing/budget transactions exist for the
        store; otherwise it must be after the current operational date. Later
        override versions must follow the last version and the current
        operational date under the store's effective calendar, even when
        there are no movements.
      tags: [Inventory]
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreCreateRequest'
      responses:
        '201':
          description: Store created in the active organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
          $ref: '#/components/responses/ActiveOrganizationRequired'
        '409':
          $ref: '#/components/responses/StoreNameConflict'
  /stores/{storeId}/operational-calendar/versions/:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    get:
      operationId: listStoreOperationalCalendarVersions
      summary: List date-effective store calendar overrides
      description: >-
        Administrator-only. The server verifies the store belongs to the
        validated active organization. Returns historical and future override
        versions with audit metadata; null or omitted fields inherit the
        network default for that field on the effective operational date.
      tags: [Inventory]
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Store calendar override history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreOperationalCalendar'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
    post:
      operationId: createStoreOperationalCalendarVersion
      summary: Append a store calendar override version
      description: >-
        Administrator-only. The server verifies the store belongs to the
        validated active organization. Creates an immutable, audited version
        effective inclusively from the supplied operational date. Each field
        is independent: null or an omitted override inherits the network
        default for that field; send any store-specific value that should
        continue from this version onward. For the first override,
        effectiveFrom may be today or in the past only while no sales, stock
        movements/counts, or purchasing/budget transactions exist for the
        store; otherwise it must be after the current operational date. Every
        later override must be later than the newest recorded override and
        after the current operational date calculated using the store's
        current effective calendar, even when no stock movements exist.
      tags: [Inventory]
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreOperationalCalendarVersionRequest'
      responses:
        '201':
          description: New store override version recorded with audit metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreOperationalCalendarVersion'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
        '409':
          $ref: '#/components/responses/OperationalCalendarVersionConflict'
  /products/:
    get:
      operationId: listProducts
      summary: List products in the active organization
      description: >-
        Administrators and buyers may read the network catalog. The
        organization is derived from the validated active session. SKU is
        unique within this organization; no organizationId is supplied by the
        client. Product creation remains administrator-only.
      tags: [Inventory]
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Products belonging to the active organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
        '403':
          $ref: '#/components/responses/CatalogAccessRequired'
        '404':
          $ref: '#/components/responses/ActiveOrganizationRequired'
    post:
      operationId: createProduct
      summary: Create a product
      description: >-
        Administrator-only. The organization is derived from the validated
        active session. SKU must be unique within that organization. Base-unit
        quantities are exact decimals: unit is countable in whole numbers, kg
        and l accept up to three decimal places. categoryId is optional and
        must identify a category in the active organization.
      tags: [Inventory]
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '201':
          description: Product created in the active organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
