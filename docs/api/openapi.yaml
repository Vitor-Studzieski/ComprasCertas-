            type: string
            enum: [budget_not_modeled, freight_not_recorded]
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/StoreProductRecommendation'
    StoreProductRecommendation:
      type: object
      additionalProperties: false
      required: [product, currentStock, averageDailyDemand, expectedDeliveries, validDemandDays, lowEvidence, evidence, coverageDays, stockDeficit, effectiveParameters, targetStock, suggestedQuantity, quantityToOrder, excessOverTarget, selectedSupplierId, reasonCodes, warnings, supplierComparisons]
      properties:
        product:
          type: object
          additionalProperties: false
          required: [id, sku, name, baseUnit, categoryId, categoryName]
          properties:
            id:
              type: string
              format: uuid
            sku:
              type: string
            name:
              type: string
            baseUnit:
              type: string
              enum: [unit, kg, l]
            categoryId:
              type: [string, 'null']
              format: uuid
            categoryName:
              type: [string, 'null']
        currentStock:
          type: string
          pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]+)?$'
        averageDailyDemand:
          type: [string, 'null']
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
          description: Six-decimal average over valid days; null when no valid demand day exists.
        expectedDeliveries:
          type: array
          description: Confirmed, unreceived quantities on orders already sent to suppliers.
          items:
            type: object
            additionalProperties: false
            required: [etaDate, quantityBase]
            properties:
              etaDate:
                type: string
                format: date
              quantityBase:
                type: string
                pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        validDemandDays:
          type: integer
          minimum: 0
          maximum: 30
        lowEvidence:
          type: boolean
        evidence:
          type: object
          additionalProperties: false
          required: [demandWindowStart, demandWindowEnd, excludedOutOfStockDays, completeSalesDays, explicitSalesDays]
          properties:
            demandWindowStart:
              type: string
              format: date
            demandWindowEnd:
              type: string
              format: date
            excludedOutOfStockDays:
              type: integer
              minimum: 0
            completeSalesDays:
              type: integer
              minimum: 0
            explicitSalesDays:
              type: integer
              minimum: 0
        coverageDays:
          type: [string, 'null']
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        stockDeficit:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        effectiveParameters:
          type: object
          additionalProperties: false
          required: [minimumStock, minimumStockSource, safetyDays, safetyDaysSource, reviewIntervalDays, reviewIntervalSource, source]
          properties:
            minimumStock:
              type: [string, 'null']
              pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,3})?$'
            minimumStockSource:
              type: [string, 'null']
              enum: [store_product, product, category, network, null]
            safetyDays:
              type: [integer, 'null']
              minimum: 0
            safetyDaysSource:
              type: [string, 'null']
              enum: [store_product, product, category, network, null]
            reviewIntervalDays:
              type: [integer, 'null']
              minimum: 1
            reviewIntervalSource:
              type: [string, 'null']
              enum: [store, network, null]
            source:
              type: string
              enum: [store_product, product, category, network, mixed, unconfigured]
        targetStock:
          type: [string, 'null']
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        suggestedQuantity:
          type: [string, 'null']
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
          description: Quantity needed before supplier MOQ or packaging adjustment, based on the selected supplier ETA.
        quantityToOrder:
          type: [string, 'null']
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
          description: Final quantity in base units after supplier MOQ and package-multiple rules.
        excessOverTarget:
          type: [string, 'null']
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        selectedSupplierId:
          type: [string, 'null']
          format: uuid
        reasonCodes:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        supplierComparisons:
          type: array
          items:
            $ref: '#/components/schemas/SupplierRecommendationComparison'
    SupplierRecommendationComparison:
      type: object
      additionalProperties: false
      required: [supplierConditionId, supplierId, supplierName, availability, deliveryLeadTimeDays, unitCost, unitCostSource, knownMerchandiseCost, purchaseUnitName, baseUnitsPerPurchaseUnit, minimumPurchaseQuantity, purchaseMultiple, freightStatus, costCompleteness, partialCost, stockAtArrival, confirmedInboundBeforeArrival, predictedShortageBeforeArrival, quantityNeededBase, orderQuantity, orderQuantityBase, excessOverTarget, selected, ruptureAvoidanceRank, costRank, reasonCodes]
      properties:
        supplierConditionId:
          type: string
          format: uuid
        supplierId:
          type: string
          format: uuid
        supplierName:
          type: string
        availability:
          type: string
          const: available
        deliveryLeadTimeDays:
          type: integer
          minimum: 0
        unitCost:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,2})?$'
          description: Price per purchase unit in BRL, using the latest confirmed receipt when it is newer than the current supplier condition; freight is excluded.
        unitCostSource:
          type: string
          enum: [supplier_condition, last_confirmed_receipt]
        knownMerchandiseCost:
          type: [string, 'null']
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,2})?$'
          description: Calculated merchandise subtotal after minimum and package multiple; freight is excluded and cost remains partial.
        purchaseUnitName:
          type: string
        baseUnitsPerPurchaseUnit:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,3})?$'
        minimumPurchaseQuantity:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,3})?$'
        purchaseMultiple:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,3})?$'
        freightStatus:
          type: string
          const: unknown
        costCompleteness:
          type: string
          const: partial
        partialCost:
          type: boolean
          const: true
        stockAtArrival:
          type: [string, 'null']
          pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]+)?$'
        confirmedInboundBeforeArrival:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
          description: Confirmed inbound units expected no later than this supplier's lead-time arrival date.
        predictedShortageBeforeArrival:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        quantityNeededBase:
          type: [string, 'null']
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        orderQuantity:
          type: [string, 'null']
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
          description: Quantity in the supplier's purchase unit.
        orderQuantityBase:
          type: [string, 'null']
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        excessOverTarget:
          type: [string, 'null']
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        selected:
          type: boolean
        ruptureAvoidanceRank:
          type: integer
          minimum: 1
        costRank:
          type: [integer, 'null']
          minimum: 1
          description: Null because freight is not available for a total-cost ranking.
        reasonCodes:
          type: array
          items:
            type: string
