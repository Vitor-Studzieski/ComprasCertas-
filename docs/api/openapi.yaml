        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderDraftCreate'
      responses:
        '201':
          description: Draft and recommendation snapshot created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
        '409':
          description: Calendar missing or current recommendations cannot create the requested draft.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/OperationalCalendarRequired'
                  - $ref: '#/components/schemas/PurchaseOrderConflict'
  /stores/{storeId}/purchase-orders/{orderId}/:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/PurchaseOrderId'
    get:
      operationId: getStorePurchaseOrder
      summary: Read a purchase order and its snapshot
      description: A manager, operator, or buyer assigned to the store may read the order.
      tags: [Purchasing]
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Purchase order detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
    patch:
      operationId: editStorePurchaseOrderDraft
      summary: Replace items or supplier on a draft
      description: >-
        Only a manager assigned to the store can edit draft orders. MOQ and
        package multiples are enforced; justifications are required for rule
        exceptions.
      tags: [Purchasing]
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderDraftPatch'
      responses:
        '200':
          description: Updated draft with its previous/new values recorded in the event history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
        '409':
          description: Order state does not permit editing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderConflict'
  /stores/{storeId}/purchase-orders/{orderId}/review/:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/PurchaseOrderId'
    post:
      operationId: reviewStorePurchaseOrder
      summary: Revalidate a draft and mark it reviewed
      description: >-
        A manager or buyer assigned to the store may review the draft. The
        server rechecks demand, stock, supplier conditions, and the source
        snapshot; stale orders cannot be approved.
      tags: [Purchasing]
      security:
        - SessionCookie: []
          CsrfHeader: []
      responses:
        '200':
          description: Reviewed order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
        '409':
          description: Source data changed or the order state does not permit review.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PurchaseOrderStale'
                  - $ref: '#/components/schemas/PurchaseOrderConflict'
  /stores/{storeId}/purchase-orders/{orderId}/approve/:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/PurchaseOrderId'
    post:
      operationId: approveStorePurchaseOrder
      summary: Revalidate and approve a reviewed order
      description: >-
        Online only; only the manager assigned to the store may approve.
        Commits estimated value to the store's weekly and monthly budget
        periods at approval time.
      tags: [Purchasing]
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderApproveRequest'
      responses:
        '200':
          description: Approved order with immutable approval snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
        '409':
          description: Budget setup/limits, source snapshot, calendar, or order state prevented approval.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PurchaseBudgetRequired'
                  - $ref: '#/components/schemas/PurchaseBudgetExceeded'
                  - $ref: '#/components/schemas/PurchaseOrderStale'
                  - $ref: '#/components/schemas/PurchaseOrderConflict'
                  - $ref: '#/components/schemas/OperationalCalendarRequired'
  /stores/{storeId}/purchase-orders/{orderId}/receipts/:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/PurchaseOrderId'
    get:
      operationId: listStorePurchaseOrderReceipts
      summary: List partial and total receipts
      description: A manager, operator, or buyer assigned to the store may read receipts.
      tags: [Purchasing]
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Receipts with actual prices and any pending excess quantities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseReceiptList'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
    post:
      operationId: receiveStorePurchaseOrder
      summary: Record a partial or total physical receipt
      description: >-
        A manager or operator assigned to the store may register a receipt.
        Accepted quantities create positive stock movements in the same
        transaction as receipt/order updates. Quantities above the approved
        order are recorded as pending excess and do not enter stock or budget.
        Actual price is per supplier purchase unit; a budget exception reason
        is required if the revised commitment exceeds either limit.
      tags: [Purchasing]
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseReceiptCreate'
      responses:
        '201':
          description: Receipt and stock movements recorded atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseReceipt'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
        '409':
          description: Budget, calendar, order state, or concurrent update prevented receipt.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PurchaseBudgetRequired'
                  - $ref: '#/components/schemas/PurchaseBudgetExceeded'
                  - $ref: '#/components/schemas/PurchaseOrderConflict'
                  - $ref: '#/components/schemas/OperationalCalendarRequired'
  /stores/{storeId}/purchase-orders/{orderId}/send/:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/PurchaseOrderId'
    post:
      operationId: markStorePurchaseOrderSent
      summary: Record that an approved order was sent to its supplier
      description: >-
        The manager or buyer assigned to the store records manual transmission
        of the approved order. This endpoint does not send an email or connect
        to the supplier. Expected deliveries cannot be registered until this
        timestamp exists.
      tags: [Purchasing]
      security:
        - SessionCookie: []
          CsrfHeader: []
      responses:
        '200':
          description: Supplier handoff recorded.
          content:
            application/json:
              schema:
                type: object
                required: [orderId, sentToSupplierAt, sentBy]
                properties:
                  orderId:
                    type: string
                    format: uuid
                  sentToSupplierAt:
                    type: string
                    format: date-time
                  sentBy:
                    type: string
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
        '409':
          description: Current order or alert state does not permit the action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderConflict'
  /stores/{storeId}/purchase-orders/{orderId}/expected-deliveries/:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/PurchaseOrderId'
    get:
      operationId: getStorePurchaseOrderDeliveryTracking
      summary: List confirmed delivery parcels and their risk alerts
      description: Managers, operators, or buyers assigned to the store may read the tracking data.
      tags: [Purchasing]
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Expected deliveries, ETA history, and risk alerts for this order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderDeliveryTracking'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
    post:
      operationId: createStoreExpectedDelivery
      summary: Register a supplier-confirmed delivery parcel
      description: >-
        The manager or buyer assigned to the store records one confirmed
        quantity and ETA after the purchase order was sent. The sum of parcels
        cannot exceed the approved, unreceived quantity. Only sent orders with
        confirmed ETAs contribute to projected stock.
      tags: [Purchasing]
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpectedDeliveryCreate'
      responses:
        '201':
          description: Confirmed delivery registered and relevant unapproved drafts marked stale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpectedDelivery'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
        '409':
          description: Order was not approved/sent, or its approved balance changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderConflict'
  /stores/{storeId}/purchase-orders/{orderId}/expected-deliveries/{deliveryId}/:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/PurchaseOrderId'
      - name: deliveryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateStoreExpectedDeliveryEta
      summary: Change a supplier-confirmed ETA
      description: >-
        A manager or buyer assigned to the store must provide a reason. The
        previous and new dates, author, and time are audited. The server
        recalculates stockout risk and creates an alert if the predicted
        stockout moves earlier. Unapproved drafts for the product are marked
        stale.
      tags: [Purchasing]
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpectedDeliveryEtaPatch'
      responses:
        '200':
          description: Delivery updated and any new risk alert returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpectedDeliveryEtaUpdate'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
        '409':
          description: Current order or alert state does not permit the action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderConflict'
  /stores/{storeId}/purchase-orders/{orderId}/delivery-risk-alerts/{alertId}/acknowledge/:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/PurchaseOrderId'
      - name: alertId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: acknowledgeDeliveryRiskAlert
      summary: Record the action taken for a delivery risk alert
      tags: [Purchasing]
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryRiskAcknowledge'
      responses:
        '200':
          description: Alert acknowledged with the action note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryRiskAlert'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
        '409':
          description: Current order or alert state does not permit the action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderConflict'
  /stores/{storeId}/purchase-orders/{orderId}/delivery-risk-alerts/{alertId}/resolve/:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/PurchaseOrderId'
      - name: alertId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: resolveDeliveryRiskAlert
      summary: Close an acknowledged delivery risk alert
      description: Record whether the risk was resolved or accepted with justification.
      tags: [Purchasing]
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryRiskResolve'
      responses:
        '200':
          description: Alert closed as resolved or justified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryRiskAlert'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
        '409':
          description: Current order or alert state does not permit the action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderConflict'
  /stores/{storeId}/purchase-orders/{orderId}/cancel-remaining/:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/PurchaseOrderId'
    post:
      operationId: cancelStorePurchaseOrderRemaining
      summary: Cancel the unreceived order balance
      description: Only the manager assigned to the store may cancel unreceived quantities.
      tags: [Purchasing]
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderCancelRemainingRequest'
      responses:
        '200':
          description: Unreceived quantity canceled; received value remains committed and in stock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
        '409':
          description: Order state does not permit cancellation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderConflict'

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: sessionid
      description: Opaque server-side Django session; exact cookie attributes are deployment configuration.
    CsrfHeader:
      type: apiKey
      in: header
      name: X-CSRFToken
      description: CSRF token obtained from GET /csrf/; required on unsafe browser requests.
  parameters:
    StoreId:
      name: storeId
      in: path
      required: true
      description: Store UUID; the server verifies it belongs to the active organization.
      schema:
        type: string
        format: uuid
    DailySaleId:
      name: dailySaleId
      in: path
      required: true
      description: Daily-sale UUID; the server verifies its store and organization scope.
      schema:
        type: string
        format: uuid
    AssortmentId:
      name: assortmentId
      in: path
      required: true
      description: Store-product link UUID; the server verifies its store and organization.
      schema:
        type: string
        format: uuid
    SupplierId:
      name: supplierId
      in: path
      required: true
      description: Supplier UUID; the server verifies it belongs to the active organization.
      schema:
        type: string
        format: uuid
    ProductId:
      name: productId
      in: path
      required: true
      description: Product UUID; the server verifies it belongs to the active organization and, for store routes, is linked to that store.
      schema:
        type: string
        format: uuid
    ProductCategoryId:
      name: categoryId
      in: path
      required: true
      description: Category UUID; the server verifies it belongs to the active organization.
      schema:
        type: string
        format: uuid
    PurchaseOrderId:
      name: orderId
      in: path
      required: true
      description: Purchase-order UUID scoped to the requested store and active organization.
      schema:
        type: string
        format: uuid
    MembershipId:
      name: membershipId
      in: path
      required: true
      description: Membership UUID in the active organization.
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      description: Invitation UUID in the active organization.
      schema:
        type: string
        format: uuid
    ImportBatchId:
      name: batchId
      in: path
      required: true
      description: Import preview UUID, visible only to its creator in the active organization.
      schema:
        type: string
        format: uuid
  responses:
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Provisional rate-limit response and representation.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds before retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    AdministratorRequired:
      description: >-
        The caller lacks the required network or store role, the membership or
        store assignment is unavailable, or required MFA assurance is missing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    ActiveOrganizationRequired:
      description: No active organization context is selected for this tenant operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActiveOrganizationRequired'
    ResourceUnavailable:
      description: Generic response for a missing or cross-organization resource identifier.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceUnavailable'
    StoreScopedNotFound:
      description: >-
        A store-scoped operation can return either active_organization_required
        when no organization is selected or resource_unavailable for a missing
        or cross-organization store/resource ID. Cross-organization existence
        is not disclosed.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ActiveOrganizationRequired'
              - $ref: '#/components/schemas/ResourceUnavailable'
    OperationalCalendarRequired:
      description: No effective operational calendar can be resolved for this store and date.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OperationalCalendarRequired'
    OperationalCalendarVersionConflict:
      description: >-
        A calendar version already exists for effectiveFrom, the requested
        date is not later than the newest recorded version, or the date is not
        later than the current operational date under the applicable network
        or store calendar. A first version may be today or earlier only before
        sales, stock movements/counts, or purchasing/budget transactions
        exist. Any later version must follow both the latest version and the
        current operational date, even when no movements exist. For network
        defaults, the current date is checked for every store using the network
        default and each store's effective calendar; for store overrides, it
        is checked using that store's current effective calendar.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OperationalCalendarVersionConflict'
    ProductSkuConflict:
      description: SKU already exists in the active organization.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductSkuConflict'
    AssortmentConflict:
      description: A conflicting store-product assortment link already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AssortmentConflict'
    StoreNameConflict:
      description: A store with this name already exists in the active organization.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StoreNameConflict'
    OpeningStockAlreadyRecorded:
      description: An opening stock batch has already been recorded for this store.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpeningStockAlreadyRecorded'
    OpeningStockConflict:
      description: >-
        The store has no effective operational calendar for the date, or an
        opening count has already been recorded. The response code identifies
        which conflict occurred.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/OperationalCalendarRequired'
              - $ref: '#/components/schemas/OpeningStockAlreadyRecorded'
    DailySalesAccessRequired:
      description: >-
        The response code is store_access_required when the user lacks an
        allowed role or assignment, administrator_required where an
        administrator-only route requires that role, or mfa_required when
        MFA has not been satisfied.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message]
            properties:
              code:
                type: string
                enum: [administrator_required, store_access_required, mfa_required]
              message:
                type: string
    CatalogAccessRequired:
      description: >-
        Catalog operations require an administrator or buyer membership and
        MFA. A buyer selecting a store-specific supplier condition must also
        have that store assigned. The code identifies the access failure.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message]
            properties:
              code:
                type: string
                enum: [catalog_access_required, catalog_store_access_required, inventory_access_required, mfa_required]
              message:
                type: string
    SupplierNameConflict:
      description: Supplier name already exists case-insensitively in the active organization.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SupplierNameConflict'
    SupplierConditionConflict:
      description: >-
        A condition version already exists for the exact supplier, product,
        scope, and effectiveFrom, or effectiveFrom does not follow the latest
        existing version for that scope. The code identifies the conflict.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/SupplierConditionVersionConflict'
              - $ref: '#/components/schemas/SupplierConditionEffectiveDateConflict'
    DailySaleWriteConflict:
      description: >-
        A write requires an effective operational calendar and a persisted
        opening-stock cutoff. A conflict also occurs when the daily-sale
        business key already exists or an operationId is replayed with a
        different payload. The response code identifies the conflict.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/OperationalCalendarRequired'
              - $ref: '#/components/schemas/OpeningStockRequired'
              - $ref: '#/components/schemas/DailySaleKeyConflict'
              - $ref: '#/components/schemas/IdempotencyConflict'
    DailySaleCorrectionConflict:
      description: >-
        A correction requires an effective operational calendar and a
        persisted opening-stock cutoff. Reusing an operationId with a
        different payload returns idempotency_conflict; a stale
        expectedCurrentQuantity returns daily_sale_quantity_conflict.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/OperationalCalendarRequired'
              - $ref: '#/components/schemas/OpeningStockRequired'
              - $ref: '#/components/schemas/IdempotencyConflict'
              - $ref: '#/components/schemas/DailySaleQuantityConflict'
  schemas:
    ImportKind:
      type: string
      enum: [products, suppliers, conditions, opening_stock, daily_sales, out_of_stock_days]
    ImportPreviewRequest:
      type: object
      additionalProperties: false
      required: [kind, file]
      properties:
        kind:
          $ref: '#/components/schemas/ImportKind'
        file:
          type: string
          format: binary
          description: CSV or XLSX file up to 10 MB and 10,000 data rows.
        storeId:
          type: string
          format: uuid
          description: Required for opening_stock, daily_sales, and out_of_stock_days.
        closedOperationalDate:
          type: string
          format: date
          description: Required for opening_stock; ISO date for the day closed by the physical count.
        operationalDateFrom:
          type: string
          format: date
          description: Required for daily_sales and marks the first complete operational date.
        operationalDateTo:
          type: string
          format: date
          description: Required for daily_sales and marks the final complete operational date.
    ImportIssue:
      type: object
      additionalProperties: false
      required: [rowNumber, code, message]
      properties:
        rowNumber:
          type: integer
          nullable: true
        code:
          type: string
        field:
          type: string
        message:
          type: string
    ImportChange:
      type: object
      additionalProperties: false
      required: [rowNumber, key, action, before, after]
      properties:
        rowNumber:
          type: integer
          nullable: true
        key:
          type: string
        action:
          type: string
          enum: [create, update, unchanged, conflict]
        before:
          type: object
          additionalProperties: true
        after:
          type: object
          additionalProperties: true
    ImportBatchPreview:
      type: object
      additionalProperties: false
      required: [batchId, kind, fileName, fileSha256, status, createdAt, expiresAt, confirmedAt, counts, issueCount, issues, changeCount, changes, canConfirm]
      properties:
        batchId:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ImportKind'
        fileName:
          type: string
        fileSha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        status:
          type: string
          enum: [preview, confirmed, expired]
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        confirmedAt:
          type: string
          format: date-time
          nullable: true
        counts:
          type: object
          additionalProperties: false
          required: [rows, create, update, unchanged]
