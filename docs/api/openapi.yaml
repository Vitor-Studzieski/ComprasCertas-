          items:
            type: string
        supplierComparisons:
          type: array
          items:
            $ref: '#/components/schemas/SupplierRecommendationComparison'
    SupplierRecommendationComparison:
      type: object
      additionalProperties: false
      required: [supplierId, supplierName, availability, deliveryLeadTimeDays, unitCost, purchaseUnitName, baseUnitsPerPurchaseUnit, minimumPurchaseQuantity, purchaseMultiple, freightStatus, costCompleteness, partialCost, stockAtArrival, predictedShortageBeforeArrival, quantityNeededBase, orderQuantity, orderQuantityBase, excessOverTarget, selected, ruptureAvoidanceRank, costRank, reasonCodes]
      properties:
        supplierId:
          type: string
          format: uuid
        supplierName:
          type: string
        availability:
          type: string
          const: available
        deliveryLeadTimeDays:
          type: integer
          minimum: 0
        unitCost:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,2})?$'
          description: Price per purchase unit in BRL; no freight is currently stored.
        purchaseUnitName:
          type: string
        baseUnitsPerPurchaseUnit:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,3})?$'
        minimumPurchaseQuantity:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,3})?$'
        purchaseMultiple:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,3})?$'
        freightStatus:
          type: string
          const: unknown
        costCompleteness:
          type: string
          const: partial
        partialCost:
          type: boolean
          const: true
        stockAtArrival:
          type: [string, 'null']
          pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]+)?$'
        predictedShortageBeforeArrival:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        quantityNeededBase:
          type: [string, 'null']
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        orderQuantity:
          type: [string, 'null']
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
          description: Quantity in the supplier's purchase unit.
        orderQuantityBase:
          type: [string, 'null']
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        excessOverTarget:
          type: [string, 'null']
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        selected:
          type: boolean
        ruptureAvoidanceRank:
          type: integer
          minimum: 1
        costRank:
          type: [integer, 'null']
          minimum: 1
          description: Null because freight is not available for a total-cost ranking.
        reasonCodes:
          type: array
          items:
            type: string
    GenericConflict:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
