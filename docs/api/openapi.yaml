    post:
      operationId: createStore
      summary: Create a store
      description: >-
        Administrator-only. The organization is derived from the validated
        active session. No organizationId is accepted. calendarOverrides is
        optional; omitted fields inherit the network's corresponding default.
        If supplied, effectiveFrom is inclusive and creates an immutable
        store-calendar version with audit metadata. An initial override may
        use today or an earlier operational date only before sales, stock
        movements/counts, or purchasing/budget transactions exist for the
        store; otherwise it must be after the current operational date. Later
        override versions must follow the last version and the current
        operational date under the store's effective calendar, even when
        there are no movements.
      tags: [Inventory]
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreCreateRequest'
      responses:
        '201':
          description: Store created in the active organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
          $ref: '#/components/responses/ActiveOrganizationRequired'
        '409':
          $ref: '#/components/responses/StoreNameConflict'
  /stores/{storeId}/operational-calendar/versions/:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    get:
      operationId: listStoreOperationalCalendarVersions
      summary: List date-effective store calendar overrides
      description: >-
        An administrator, manager, operator, or buyer assigned to this store
        may read historical and future override versions. The server verifies
        store scope; null or omitted fields inherit the network default for
        that field on the effective operational date.
      tags: [Inventory]
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Store calendar override history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreOperationalCalendar'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
    post:
      operationId: createStoreOperationalCalendarVersion
      summary: Append a store calendar override version
      description: >-
        A network administrator or manager assigned to this store creates an
        immutable, audited version
        effective inclusively from the supplied operational date. Each field
        is independent: null or an omitted override inherits the network
        default for that field; send any store-specific value that should
        continue from this version onward. For the first override,
        effectiveFrom may be today or in the past only while no sales, stock
        movements/counts, or purchasing/budget transactions exist for the
        store; otherwise it must be after the current operational date. Every
        later override must be later than the newest recorded override and
        after the current operational date calculated using the store's
        current effective calendar, even when no stock movements exist.
      tags: [Inventory]
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreOperationalCalendarVersionRequest'
      responses:
        '201':
          description: New store override version recorded with audit metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreOperationalCalendarVersion'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
        '409':
          $ref: '#/components/responses/OperationalCalendarVersionConflict'
