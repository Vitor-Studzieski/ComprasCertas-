        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
        '409':
          $ref: '#/components/responses/AssortmentConflict'
  /stores/{storeId}/opening-stock-counts/:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    post:
      operationId: createOpeningStockCount
      summary: Record one atomic opening stock count batch
      description: >-
        Administrator-only. Requires an effective operational calendar for
        both the store's current operational date and closedOperationalDate;
        a future closedOperationalDate is rejected. The server derives
        cutoffDate = closedOperationalDate + 1 operational day. Every line
        must refer to a product in this store's active assortment on
        closedOperationalDate; a complete batch contains one line for every
        product active in the assortment, including explicit zero counts.
        The initial physical count is recorded by an administrator and
        produces immutable audit metadata identifying actor, server time,
        store, closed date, each product/quantity, and the opening movement.
        The server records the origin; this endpoint always records `manual`,
        while a future validated spreadsheet flow may record `spreadsheet`.
        All lines are validated and written atomically; on any error no line
        is committed. Quantities are exact decimal
        strings: unit products require integers, kg/l products allow at most
        three fractional places, and values are never rounded.
      tags: [Inventory]
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpeningStockCountRequest'
      responses:
        '201':
          description: Atomic opening count recorded as ledger movements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpeningStockCount'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
        '409':
          $ref: '#/components/responses/OpeningStockConflict'
  /stores/{storeId}/stock-balances/:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    get:
      operationId: listCurrentStockBalances
      summary: Read current stock balances from movements
      description: >-
        Administrator-only. Requires an effective operational calendar for
        the store's current operational date. Balances are calculated by
        aggregating the store's stock movements; this contract does not
        introduce a separate materialized projection. Quantities are exact
        decimals and follow each product's base-unit precision. Store
        ownership is checked against the validated active organization.
      tags: [Inventory]
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Current ledger-aggregated balances for the store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockBalanceList'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
        '409':
          $ref: '#/components/responses/OperationalCalendarRequired'
  /stores/{storeId}/daily-sales/:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    get:
      operationId: listDailySales
      summary: List daily product sales totals
      description: >-
        Daily totals are scoped to the validated active organization and this
        store. operationalDate is a store-local business date determined by
        the effective time zone and operational-day start; the query dates
        are already operational dates and do not include a client timezone.
        The role model is store-scoped: an operator or manager assigned to the
        store may read these records. This PR temporarily permits only
        administrators until store-role onboarding is available. Reads may be
        used before an opening count and return an empty list when no sales
        exist. Product dates before the opening cutoff are demand-only while
        within the demand-eligible assortment period; records at/after it may
        have created stock movements. Sales after an assortment end may be
        retained for liquidation but are not demand inputs.
      tags: [Sales]
      security:
        - SessionCookie: []
      parameters:
        - name: operationalDateFrom
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: operationalDateTo
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Daily totals for the inclusive store-local operational-date range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailySaleList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/DailySalesAccessRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
        '409':
          $ref: '#/components/responses/OperationalCalendarRequired'
    post:
      operationId: createDailySale
      summary: Record a manual daily sales total
      description: >-
        The organization is derived from the validated active session and the
        store is validated within it; no organizationId is accepted. The
        effective store calendar must resolve for operationalDate. An opening
        stock count must have established the store cutoff before a sale can
        be written. For operationalDate before cutoffDate, the total affects
        demand only and creates no movement. On or after cutoffDate, the total
        and one outbound stock movement are committed atomically. Products
        must belong to this organization and have a store-product link whose
        effectiveFrom is on or before operationalDate. After the link's
        exclusive effectiveTo, explicit sales may still be recorded to
        liquidate residual stock but are not demand-eligible or recommendation
        inputs.

        Authorization target: an operator or manager assigned to this store.
        This PR temporarily gates writes to administrators until store-role
        onboarding is available; the eventual role check must remain
        store-scoped. Browser writes require CSRF.

        operationId is a client-generated UUID idempotency key. Repeating the
        same operationId with the same canonical payload returns the existing
        sale; reusing it with a different payload returns 409. The unique
        business key is organization + store + SKU + operationalDate; a
        different operationId for an existing key also returns 409.
      tags: [Sales]
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailySaleCreateRequest'
      responses:
        '201':
          description: New daily total recorded; if at/after cutoff, the outbound movement committed atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailySale'
        '200':
          description: Idempotent replay; returns the existing sale resource without duplicating its movement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailySale'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/DailySalesAccessRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
        '409':
          $ref: '#/components/responses/DailySaleWriteConflict'
  /stores/{storeId}/daily-sales/{dailySaleId}/corrections/:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/DailySaleId'
    get:
      operationId: listDailySaleCorrections
      summary: List the audit history of a daily sales total
      description: >-
        Returns every explicit correction in chronological order, preserving
        the previous and new totals, actor, reason, server timestamp, and any
        compensating movement. Authorization follows the store-scoped role
        model; this PR temporarily permits only administrators until
        store-role onboarding is available.
      tags: [Sales]
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Correction audit history for the daily sale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailySaleCorrectionList'
        '403':
          $ref: '#/components/responses/DailySalesAccessRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
    post:
      operationId: correctDailySale
      summary: Explicitly correct a daily sales total
      description: >-
        Replaces the current daily total and appends an immutable correction
        audit record; it does not create a second daily-sale row. The request
        must include expectedCurrentQuantity from the screen's latest read.
        After idempotent replay lookup, the backend locks the sale and rejects
        a correction if its current quantity no longer matches that expected
        value. The actor and server time are derived and recorded by the
        backend, while reason is required in the request. The effective store
        calendar and an existing opening cutoff are required. If
        operationalDate is before cutoffDate, the correction changes demand
        data only. On/after cutoffDate, the correction and a compensating
        stock movement for the difference only are committed in the same
        transaction. Retrying the same operationId with the same payload
        returns the existing correction; reusing that ID with a different
        payload returns 409. Authorization target is a store-assigned
        operator or manager; this PR temporarily gates writes to
        administrators until store-role onboarding is available. Browser
        writes require CSRF.
      tags: [Sales]
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailySaleCorrectionRequest'
      responses:
        '201':
          description: Correction recorded with old/new values and audit metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailySaleCorrection'
        '200':
          description: Idempotent replay; returns the existing correction without duplicating its movement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailySaleCorrection'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/DailySalesAccessRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
        '409':
          $ref: '#/components/responses/DailySaleCorrectionConflict'
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: sessionid
      description: Opaque server-side Django session; exact cookie attributes are deployment configuration.
    CsrfHeader:
      type: apiKey
      in: header
      name: X-CSRFToken
      description: CSRF token obtained from GET /csrf/; required on unsafe browser requests.
  parameters:
    StoreId:
      name: storeId
      in: path
      required: true
      description: Store UUID; the server verifies it belongs to the active organization.
      schema:
        type: string
        format: uuid
    DailySaleId:
      name: dailySaleId
      in: path
      required: true
      description: Daily-sale UUID; the server verifies its store and organization scope.
      schema:
        type: string
        format: uuid
    AssortmentId:
      name: assortmentId
      in: path
      required: true
      description: Store-product link UUID; the server verifies its store and organization.
      schema:
        type: string
        format: uuid
    SupplierId:
      name: supplierId
      in: path
      required: true
      description: Supplier UUID; the server verifies it belongs to the active organization.
      schema:
        type: string
        format: uuid
    ProductId:
      name: productId
      in: path
      required: true
      description: Product UUID; the server verifies it belongs to the active organization and, for store routes, is linked to that store.
      schema:
        type: string
        format: uuid
    ProductCategoryId:
      name: categoryId
      in: path
      required: true
      description: Category UUID; the server verifies it belongs to the active organization.
      schema:
        type: string
        format: uuid
  responses:
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Provisional rate-limit response and representation.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds before retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    AdministratorRequired:
      description: The active membership does not have the administrator role required by this initial slice.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    ActiveOrganizationRequired:
      description: No active organization context is selected for this tenant operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActiveOrganizationRequired'
    ResourceUnavailable:
      description: Generic response for a missing or cross-organization resource identifier.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceUnavailable'
    StoreScopedNotFound:
      description: >-
        A store-scoped operation can return either active_organization_required
        when no organization is selected or resource_unavailable for a missing
        or cross-organization store/resource ID. Cross-organization existence
        is not disclosed.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ActiveOrganizationRequired'
              - $ref: '#/components/schemas/ResourceUnavailable'
    OperationalCalendarRequired:
      description: No effective operational calendar can be resolved for this store and date.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OperationalCalendarRequired'
    OperationalCalendarVersionConflict:
      description: >-
        A calendar version already exists for effectiveFrom, the requested
        date is not later than the newest recorded version, or the date is not
        later than the current operational date under the applicable network
        or store calendar. A first version may be today or earlier only before
        sales, stock movements/counts, or purchasing/budget transactions
        exist. Any later version must follow both the latest version and the
        current operational date, even when no movements exist. For network
        defaults, the current date is checked for every store using the network
        default and each store's effective calendar; for store overrides, it
        is checked using that store's current effective calendar.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OperationalCalendarVersionConflict'
    ProductSkuConflict:
      description: SKU already exists in the active organization.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductSkuConflict'
    AssortmentConflict:
      description: A conflicting store-product assortment link already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AssortmentConflict'
    StoreNameConflict:
      description: A store with this name already exists in the active organization.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StoreNameConflict'
    OpeningStockAlreadyRecorded:
      description: An opening stock batch has already been recorded for this store.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpeningStockAlreadyRecorded'
    OpeningStockConflict:
      description: >-
        The store has no effective operational calendar for the date, or an
        opening count has already been recorded. The response code identifies
        which conflict occurred.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/OperationalCalendarRequired'
              - $ref: '#/components/schemas/OpeningStockAlreadyRecorded'
    DailySalesAccessRequired:
      description: >-
        The response code is administrator_required when the caller lacks the
        temporary administrator role, or mfa_required when MFA has not been
        satisfied. The eventual role model grants operators and managers
        access only to stores assigned to them, after required MFA.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message]
            properties:
              code:
                type: string
                enum: [administrator_required, mfa_required]
              message:
                type: string
    CatalogAccessRequired:
      description: >-
        The active membership must be an administrator or buyer, and MFA must
        be satisfied when required by the role. The code identifies the
        specific access failure.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message]
            properties:
              code:
                type: string
                enum: [catalog_access_required, catalog_store_access_required, mfa_required]
              message:
                type: string
    SupplierNameConflict:
      description: Supplier name already exists case-insensitively in the active organization.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SupplierNameConflict'
    SupplierConditionConflict:
      description: >-
        A condition version already exists for the exact supplier, product,
        scope, and effectiveFrom, or effectiveFrom does not follow the latest
        existing version for that scope. The code identifies the conflict.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/SupplierConditionVersionConflict'
              - $ref: '#/components/schemas/SupplierConditionEffectiveDateConflict'
    DailySaleWriteConflict:
      description: >-
        A write requires an effective operational calendar and a persisted
        opening-stock cutoff. A conflict also occurs when the daily-sale
        business key already exists or an operationId is replayed with a
        different payload. The response code identifies the conflict.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/OperationalCalendarRequired'
              - $ref: '#/components/schemas/OpeningStockRequired'
              - $ref: '#/components/schemas/DailySaleKeyConflict'
              - $ref: '#/components/schemas/IdempotencyConflict'
    DailySaleCorrectionConflict:
      description: >-
        A correction requires an effective operational calendar and a
        persisted opening-stock cutoff. Reusing an operationId with a
        different payload returns idempotency_conflict; a stale
        expectedCurrentQuantity returns daily_sale_quantity_conflict.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/OperationalCalendarRequired'
              - $ref: '#/components/schemas/OpeningStockRequired'
              - $ref: '#/components/schemas/IdempotencyConflict'
              - $ref: '#/components/schemas/DailySaleQuantityConflict'
  schemas:
    RegistrationRequest:
      type: object
      additionalProperties: false
      required: [organizationName, administratorName, email, password]
      properties:
        organizationName:
          type: string
          minLength: 2
          maxLength: 160
          description: Name of the network; length bounds are provisional.
        administratorName:
          type: string
          minLength: 2
          maxLength: 160
          description: Administrator's name; length bounds are provisional.
        email:
          type: string
          format: email
          maxLength: 254
          description: Email syntax/length validation is provisional.
        password:
          type: string
          format: password
          writeOnly: true
          description: Password policy and validation limits remain to be decided.
    RegistrationAccepted:
      description: Provisional response representation.
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          const: confirmation_required
        message:
          type: string
          description: Localized message suitable for display to the user.
    Problem:
      description: Provisional error envelope; codes, fields, and localization contract remain to be decided.
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
          description: Safe, localized summary that does not expose secrets.
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    SessionAuthenticated:
      description: >-
        Successful authenticated state. The credential is in the server-side
        session cookie, never in a response body. This schema is returned only
        after email confirmation and all role-required factors are complete.
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: authenticated
    CurrentSession:
      description: >-
        Provisional session-context representation. Organizations contains
        only active memberships; activeOrganizationId is null when no context
        has been selected or the user has no active membership.
      type: object
      additionalProperties: false
      required: [status, activeOrganizationId, organizations]
      properties:
        status:
          type: string
          enum: [authenticated, organization_selection_required]
        activeOrganizationId:
          type: [string, 'null']
          format: uuid
          description: Selected server-side context; not an authorization credential.
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationMembership'
    OrganizationMembership:
      type: object
      additionalProperties: false
      required: [id, name, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          description: Role from the active membership; exact serialized role values are provisional.
    OrganizationSelectionRequest:
      description: Organization ID is a context selection request, not authority.
      type: object
      additionalProperties: false
      required: [organizationId]
      properties:
        organizationId:
          type: string
          format: uuid
          description: Must identify an active membership owned by the authenticated user.
    OrganizationUnavailable:
      description: Generic response for any organization that cannot be selected by this user.
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          const: organization_unavailable
        message:
          type: string
          description: Same generic wording for unknown organizations and missing active memberships.
    MfaRequired:
      description: >-
        Pre-authentication state only. It has no session cookie and cannot
        access any application operation. The challenge is bound to the user
        and purpose, expires after 10 minutes, and allows at most five failed
        verification attempts.
      type: object
      additionalProperties: false
      required: [status, challengeId, methods]
      properties:
        status:
          type: string
          const: second_factor_required
        challengeId:
          type: string
          format: uuid
          description: Opaque reference to a short-lived server-side challenge; not an access token.
        methods:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [webauthn, recovery_code]
    MfaEnrollmentRequired:
      description: >-
        Pre-authentication state for a privileged account without an enrolled
        WebAuthn credential or unused recovery code. No application session is
        created until enrollment has been verified. The challenge expires
        after 10 minutes and allows at most five failed verification attempts.
      type: object
      additionalProperties: false
      required: [status, challengeId, methods]
      properties:
        status:
          type: string
          const: second_factor_enrollment_required
        challengeId:
          type: string
          format: uuid
          description: Opaque, short-lived enrollment reference; not an access token.
        methods:
          type: array
          items:
            type: string
            const: webauthn
    PreAuthChallengeRequest:
      type: object
      additionalProperties: false
      required: [challengeId]
      properties:
        challengeId:
          type: string
          format: uuid
    WebAuthnOptions:
      description: >-
        WebAuthn PublicKeyCredentialCreationOptions or
        PublicKeyCredentialRequestOptions. The server validates the challenge,
        configured RP ID and allowed origins, credential signature, replay
        state, and required user verification.
      type: object
      additionalProperties: true
    WebAuthnVerificationRequest:
      description: >-
        WebAuthn registration or assertion response plus the opaque pre-auth
        challenge reference. The server validates challenge, origin, RP ID,
        user verification, credential signature, and replay state.
      type: object
      additionalProperties: false
      required: [challengeId, credential]
      properties:
        challengeId:
          type: string
          format: uuid
        credential:
          type: object
          additionalProperties: true
    MfaEnrollmentComplete:
      description: >-
        Returned once after successful first-factor enrollment. Ten
        single-use recovery codes are displayed a single time; only their
        password hashes are stored server-side.
      type: object
      required: [status, recoveryCodes]
      properties:
        status:
          type: string
          const: authenticated
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
    ActiveOrganizationRequired:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          const: active_organization_required
        message:
          type: string
    ResourceUnavailable:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          const: resource_unavailable
        message:
          type: string
          description: Generic wording for unknown and cross-organization resource IDs.
    OperationalCalendarRequired:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          const: operational_calendar_required
        message:
          type: string
    OperationalCalendarVersionConflict:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          const: operational_calendar_version_conflict
        message:
          type: string
          description: Generic message for duplicate, non-increasing, or retroactive effectiveFrom dates.
    ProductSkuConflict:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          const: product_sku_conflict
        message:
          type: string
    SupplierNameConflict:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          const: supplier_name_conflict
        message:
          type: string
    SupplierConditionVersionConflict:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          const: supplier_condition_conflict
        message:
          type: string
    SupplierConditionEffectiveDateConflict:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          const: supplier_condition_effective_date_conflict
        message:
          type: string
    AssortmentConflict:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          const: assortment_conflict
        message:
          type: string
    StoreNameConflict:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          const: store_name_conflict
        message:
          type: string
    OpeningStockAlreadyRecorded:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          const: opening_stock_already_recorded
        message:
          type: string
    OpeningStockRequired:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          const: opening_stock_required
        message:
          type: string
          description: A persisted opening count is required before sale writes or corrections.
    DailySaleKeyConflict:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          const: daily_sale_conflict
        message:
          type: string
          description: A daily total already exists for this store, SKU, and operational date.
    IdempotencyConflict:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          const: idempotency_conflict
        message:
          type: string
          description: The operationId was already used with a different canonical payload.
    DailySaleQuantityConflict:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          const: daily_sale_quantity_conflict
        message:
          type: string
          description: The sale total changed after the client read it; reload before correcting.
    OrganizationOperationalCalendarVersionRequest:
      type: object
      additionalProperties: false
      required: [timeZone, operationalDayStart, effectiveFrom]
      properties:
        timeZone:
          type: string
          minLength: 1
          maxLength: 64
          description: IANA time-zone identifier used by the network default.
        operationalDayStart:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Local wall-clock time in HH:mm; no default is assumed.
        effectiveFrom:
          type: string
          format: date
          description: Inclusive operational date for this immutable version.
    OrganizationOperationalCalendarVersion:
      type: object
      additionalProperties: false
      required: [id, timeZone, operationalDayStart, effectiveFrom, createdBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        timeZone:
          type: string
        operationalDayStart:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        effectiveFrom:
          type: string
          format: date
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    OrganizationOperationalCalendar:
      type: object
      additionalProperties: false
      required: [versions]
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationOperationalCalendarVersion'
    StoreOperationalCalendarVersionRequest:
      type: object
      additionalProperties: false
      required: [effectiveFrom]
      properties:
        timeZone:
          type: [string, 'null']
          minLength: 1
          maxLength: 64
          description: Null or omitted means inherit the network default for this date.
        operationalDayStart:
          type: [string, 'null']
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Null or omitted means inherit the network default for this date.
        effectiveFrom:
          type: string
          format: date
