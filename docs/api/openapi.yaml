openapi: 3.1.0
info:
  title: CompraCerta API
  version: 0.1.0
  summary: Draft contract for the first online foundation.
  description: |
    Draft contract for the first online cycle. Route details, status codes,
    token lifetime, WebAuthn RP ID/origins, and validation limits remain
    provisional. Approved product rules: signup collects network name,
    administrator name/email, and password; email confirmation is required
    before operating; the 30-day trial starts at confirmation; no CNPJ,
    address, or payment details are collected at signup. A global user may
    join another network only through a separate invitation. Administrators
    and people who approve orders or stock adjustments must complete MFA
    before an authenticated session is issued. The technical draft uses
    WebAuthn and server-side Django sessions; it does not use bearer/JWT tokens.
servers:
  - url: /api/v1
    description: Versioned API base path
paths:
  /health/:
    get:
      operationId: getHealth
      summary: Check API availability (draft)
      description: Provisional route and response shape; the exact health-check semantics remain to be decided.
      tags: [System]
      security: []
      responses:
        '200':
          description: API is available.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /registrations/:
    post:
      operationId: createRegistration
      summary: Start a network's self-service registration
      description: |
        Creates only a pending registration intent and sends an email
        confirmation link; it does not create a usable organization or
        membership. On confirmation, the backend creates the global user,
        organization, active administrator membership, and 30-day trial in one
        transaction. The trial starts at the confirmation time and no session
        is issued by confirmation. The email link expires 24 hours after issue;
        resending creates another valid link without invalidating earlier links
        that have not expired. The token is carried in the URL fragment and the
        client sends it to the confirmation endpoint in the request body. An
        email that already belongs to a global account cannot self-create
        another network; additional memberships require an invitation. The
        response is generic for new and existing accounts to reduce account
        enumeration. Route and payload details remain provisional.
      tags: [Identity]
      security:
        - CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '202':
          description: >-
            Generic response for an eligible registration request. The same
            response is used when the email already belongs to an account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationAccepted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /email-confirmations/:
    post:
      operationId: confirmEmail
      summary: Confirm an administrator's email address
      description: |
        Email confirmation is required before operating. Successful
        confirmation verifies the email and atomically creates the global user,
        organization, active administrator membership, and 30-day trial. The
        trial starts at the confirmation timestamp and ends exactly 30 days
        later. Confirmation does not issue a session; the administrator must
        sign in and complete MFA enrollment first. The implementation accepts
        the one-time token from the email link's URL fragment and expires each
        issued token after 24 hours. Invalid, expired, and already-used tokens
        receive the same response. A repeated confirmation must not create
        duplicate organizations or trials.
      tags: [Identity]
      security:
        - CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 1
                  description: One-time token extracted by the client from the email link fragment.
      responses:
        '200':
          description: >-
            Email confirmed, organization and administrator membership created,
            and 30-day trial started. No authenticated session is created.
          content:
            application/json:
              schema:
                type: object
                required: [status, trialStartsAt, trialEndsAt]
                properties:
                  status:
                    type: string
                    const: confirmed
                  trialStartsAt:
                    type: string
                    format: date-time
                  trialEndsAt:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/ValidationError'
        '410':
          description: >-
            Token is invalid, expired, or already used. The response does not
            distinguish these states.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /email-confirmations/resend/:
    post:
      operationId: resendEmailConfirmation
      summary: Resend the confirmation email
      description: |
        Sends a generic message that does not disclose whether the email is
        registered, pending, or already confirmed. For an existing account,
        any additional network membership still requires a separate invitation.
        Rate-limit values remain provisional. Each resend creates an additional
        24-hour token; previously issued, unexpired tokens remain usable.
      tags: [Identity]
      security:
        - CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Request accepted.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: accepted
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /csrf/:
    get:
      operationId: getCsrfToken
      summary: Obtain a CSRF token for browser requests
      description: >-
        Provisional bootstrap endpoint. Browser clients call this before
        registration, email confirmation, login, or other unsafe requests.
        The response sets Django's CSRF cookie and returns the masked token;
        browser clients send that token in X-CSRFToken on unsafe requests. The
        API validates it with Django CSRF protection, including on anonymous
        login requests. The client includes credentials for same-origin calls.
      tags: [Security]
      security: []
      responses:
        '200':
          description: CSRF cookie and token issued.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Django CSRF cookie; not an authentication session.
          content:
            application/json:
              schema:
                type: object
                required: [csrfToken]
                properties:
                  csrfToken:
                    type: string
  /sessions/:
    post:
      operationId: createSession
      summary: Sign in with email and password
      description: |
        Provisional route and response representation. The email must be
        confirmed. A global user with any active administrator, store manager,
        or buyer membership must complete MFA before a session is issued. If no factor
        is enrolled, return an enrollment-required pre-authentication state;
        otherwise return an authentication-required pre-authentication state.
        Neither state is an application session. A session is created only
        after all required factors pass. A browser with an existing session
        must sign out before starting a different login. Sessions are
        server-side Django sessions carried in a Secure, HttpOnly, SameSite
        cookie. A session without a completed MFA ceremony cannot access
        protected application operations while the account has any active
        privileged membership, including after a role change. Unsafe browser
        requests use an explicit CSRF token. RP ID and allowed origins are
        deployment configuration.
      tags: [Identity]
      security:
        - CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  writeOnly: true
      responses:
        '200':
          description: >-
            Password accepted. The response is one of: authenticated (only
            when MFA is not required), second_factor_required, or
            second_factor_enrollment_required. A session cookie is set only
            for the authenticated state; pre-authentication states do not set
            an application session.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: >-
                Secure, HttpOnly, SameSite server-side session cookie; present
                only when the response status is authenticated.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SessionAuthenticated'
                  - $ref: '#/components/schemas/MfaRequired'
                  - $ref: '#/components/schemas/MfaEnrollmentRequired'
        '401':
          description: Invalid credentials or unconfirmed email; details are generic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: An authenticated browser must sign out before another login.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /sessions/mfa/enrollment/options/:
    post:
      operationId: createMfaEnrollmentOptions
      summary: Begin WebAuthn enrollment for a privileged account
      description: >-
        Uses the short-lived pre-authentication challenge returned by password
        login. The challenge expires after 10 minutes and allows at most five
        failed verification attempts. This does not create an application
        session. User verification is required. RP ID, allowed origins, and
        timeout are deployment configuration.
      tags: [Identity]
      security:
        - CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreAuthChallengeRequest'
      responses:
        '200':
          description: WebAuthn credential-creation options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnOptions'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Challenge invalid, expired, or already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /sessions/mfa/enrollment/verify/:
    post:
      operationId: verifyMfaEnrollment
      summary: Verify and save a new WebAuthn credential
      description: >-
        The server verifies the WebAuthn registration response against the
        stored challenge, expected origin and RP ID, and required user
        verification. On success, it stores public credential data, issues
        the first session, and returns ten recovery codes once. Only password
        hashes of the recovery codes are stored. Private key material is never
        sent to or stored by CompraCerta.
      tags: [Identity]
      security:
        - CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnVerificationRequest'
      responses:
        '200':
          description: Enrollment verified; session cookie issued and recovery codes shown once.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Secure, HttpOnly, SameSite server-side session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrollmentComplete'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Challenge or WebAuthn response could not be verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /sessions/mfa/authentication/options/:
    post:
      operationId: createMfaAuthenticationOptions
      summary: Begin WebAuthn verification during login
      description: >-
        Uses a short-lived, single-use challenge. The challenge expires after
        10 minutes and allows at most five failed verification attempts.
        User verification is required for the assertion.
      tags: [Identity]
      security:
        - CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreAuthChallengeRequest'
      responses:
        '200':
          description: WebAuthn assertion options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnOptions'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Challenge invalid, expired, or already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /sessions/mfa/authentication/verify/:
    post:
      operationId: verifyMfaAuthentication
      summary: Verify a WebAuthn assertion and create a session
      tags: [Identity]
      security:
        - CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnVerificationRequest'
      responses:
        '200':
          description: MFA verified and server-side session cookie issued.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Secure, HttpOnly, SameSite server-side session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAuthenticated'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Challenge or WebAuthn response could not be verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /sessions/mfa/recovery-code/:
    post:
      operationId: verifyRecoveryCode
      summary: Use a one-time recovery code during login
      description: >-
        The recovery code is consumed atomically and cannot be reused. The
        challenge expires after 10 minutes and allows at most five failed
        verification attempts.
      tags: [Identity]
      security:
        - CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challengeId, recoveryCode]
              properties:
                challengeId:
                  type: string
                  format: uuid
                recoveryCode:
                  type: string
                  writeOnly: true
      responses:
        '200':
          description: Recovery code accepted and server-side session cookie issued.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Secure, HttpOnly, SameSite server-side session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAuthenticated'
        '401':
          description: Recovery code is invalid, expired, or already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /sessions/current/:
    delete:
      operationId: deleteCurrentSession
      summary: Sign out of the current session
      tags: [Identity]
      security:
        - SessionCookie: []
          CsrfHeader: []
      responses:
        '204':
          description: Session invalidated.
        '401':
          description: No active session.

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: sessionid
      description: Opaque server-side Django session; exact cookie attributes are deployment configuration.
    CsrfHeader:
      type: apiKey
      in: header
      name: X-CSRFToken
      description: CSRF token obtained from GET /csrf/; required on unsafe browser requests.
  responses:
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Provisional rate-limit response and representation.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds before retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    RegistrationRequest:
      type: object
      additionalProperties: false
      required: [organizationName, administratorName, email, password]
      properties:
        organizationName:
          type: string
          minLength: 2
          maxLength: 160
          description: Name of the network; length bounds are provisional.
        administratorName:
          type: string
          minLength: 2
          maxLength: 160
          description: Administrator's name; length bounds are provisional.
        email:
          type: string
          format: email
          maxLength: 254
          description: Email syntax/length validation is provisional.
        password:
          type: string
          format: password
          writeOnly: true
          description: Password policy and validation limits remain to be decided.
    RegistrationAccepted:
      description: Provisional response representation.
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          const: confirmation_required
        message:
          type: string
          description: Localized message suitable for display to the user.
    Problem:
      description: Provisional error envelope; codes, fields, and localization contract remain to be decided.
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
          description: Safe, localized summary that does not expose secrets.
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    SessionAuthenticated:
      description: >-
        Successful authenticated state. The credential is in the server-side
        session cookie, never in a response body. This schema is returned only
        after email confirmation and all role-required factors are complete.
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: authenticated
    MfaRequired:
      description: >-
        Pre-authentication state only. It has no session cookie and cannot
        access any application operation. The challenge is bound to the user
        and purpose, expires after 10 minutes, and allows at most five failed
        verification attempts.
      type: object
      additionalProperties: false
      required: [status, challengeId, methods]
      properties:
        status:
          type: string
          const: second_factor_required
        challengeId:
          type: string
          format: uuid
          description: Opaque reference to a short-lived server-side challenge; not an access token.
        methods:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [webauthn, recovery_code]
    MfaEnrollmentRequired:
      description: >-
        Pre-authentication state for a privileged account without an enrolled
        WebAuthn credential or unused recovery code. No application session is
        created until enrollment has been verified. The challenge expires
        after 10 minutes and allows at most five failed verification attempts.
      type: object
      additionalProperties: false
      required: [status, challengeId, methods]
      properties:
        status:
          type: string
          const: second_factor_enrollment_required
        challengeId:
          type: string
          format: uuid
          description: Opaque, short-lived enrollment reference; not an access token.
        methods:
          type: array
          items:
            type: string
            const: webauthn
    PreAuthChallengeRequest:
      type: object
      additionalProperties: false
      required: [challengeId]
      properties:
        challengeId:
          type: string
          format: uuid
    WebAuthnOptions:
      description: >-
        WebAuthn PublicKeyCredentialCreationOptions or
        PublicKeyCredentialRequestOptions. The server validates the challenge,
        configured RP ID and allowed origins, credential signature, replay
        state, and required user verification.
      type: object
      additionalProperties: true
    WebAuthnVerificationRequest:
      description: >-
        WebAuthn registration or assertion response plus the opaque pre-auth
        challenge reference. The server validates challenge, origin, RP ID,
        user verification, credential signature, and replay state.
      type: object
      additionalProperties: false
      required: [challengeId, credential]
      properties:
        challengeId:
          type: string
          format: uuid
        credential:
          type: object
          additionalProperties: true
    MfaEnrollmentComplete:
      description: >-
        Returned once after successful first-factor enrollment. Ten
        single-use recovery codes are displayed a single time; only their
        password hashes are stored server-side.
      type: object
      required: [status, recoveryCodes]
      properties:
        status:
          type: string
          const: authenticated
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
