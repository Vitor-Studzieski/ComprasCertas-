      properties:
        timeZone:
          type: [string, 'null']
          minLength: 1
          maxLength: 64
          description: Null or omitted means inherit the network default for this date.
        operationalDayStart:
          type: [string, 'null']
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Null or omitted means inherit the network default for this date.
        effectiveFrom:
          type: string
          format: date
          description: Inclusive operational date for this immutable override version.
    StoreOperationalCalendarVersion:
      type: object
      additionalProperties: false
      required: [id, timeZone, operationalDayStart, effectiveFrom, createdBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        timeZone:
          type: [string, 'null']
          description: Null inherits the network default for this date.
        operationalDayStart:
          type: [string, 'null']
          description: Null inherits the network default for this date.
        effectiveFrom:
          type: string
          format: date
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    StoreOperationalCalendar:
