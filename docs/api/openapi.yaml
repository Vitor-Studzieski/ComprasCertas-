        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
    post:
      operationId: declareStoreSalesCoverage
      summary: Declare a store sales period complete
      description: >-
        A manager or operator assigned to the store declares the entire
        inclusive date range complete. Future dates are rejected; the actor
        and time are audited.
      tags: [Replenishment]
