          type: string
          format: uuid
        dailySaleId:
          type: string
          format: uuid
        operationId:
          type: string
          format: uuid
        previousQuantity:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,3})?$'
        newQuantity:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,3})?$'
        reason:
