    StoreCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        calendarOverrides:
          type: object
          additionalProperties: false
          required: [effectiveFrom]
          properties:
            timeZone:
              type: [string, 'null']
              minLength: 1
              maxLength: 64
            operationalDayStart:
              type: [string, 'null']
              pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
            effectiveFrom:
              type: string
              format: date
    Store:
      type: object
      additionalProperties: false
      required: [id, name, isActive, calendarOverrides, effectiveCalendar, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        isActive:
          type: boolean
        calendarOverrides:
          $ref: '#/components/schemas/StoreCalendarOverrides'
        effectiveCalendar:
          oneOf:
            - $ref: '#/components/schemas/EffectiveOperationalCalendar'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
    StoreList:
      type: object
      additionalProperties: false
      required: [stores]
      properties:
        stores:
          type: array
          items:
            $ref: '#/components/schemas/Store'
    ProductCreateRequest:
      type: object
      additionalProperties: false
      required: [sku, name, baseUnit]
      properties:
        sku:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 200
        baseUnit:
          type: string
          enum: [unit, kg, l]
        categoryId:
          type: [string, 'null']
          format: uuid
          description: Optional category identifier in the active organization.
    Product:
      type: object
      additionalProperties: false
      required: [id, sku, name, baseUnit, isActive, createdAt, categoryId, categoryName]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        baseUnit:
          type: string
          enum: [unit, kg, l]
        categoryId:
          type: [string, 'null']
          format: uuid
        categoryName:
          type: [string, 'null']
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
    ProductList:
      type: object
      additionalProperties: false
      required: [products]
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
    SupplierCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        contactName:
          type: string
          maxLength: 160
        email:
          type: string
          maxLength: 254
          description: Empty is allowed; a non-empty value must be a valid email address.
        phone:
          type: string
          maxLength: 32
        notes:
          type: string
          maxLength: 1000
    SupplierUpdateRequest:
