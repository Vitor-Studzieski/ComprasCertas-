            create:
              type: integer
            update:
              type: integer
            unchanged:
              type: integer
        issueCount:
          type: integer
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ImportIssue'
        changeCount:
          type: integer
        changes:
          type: array
          items:
