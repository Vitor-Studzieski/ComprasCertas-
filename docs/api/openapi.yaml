  /stores/{storeId}/replenishment-recommendations/:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    get:
      operationId: getStoreReplenishmentRecommendations
      summary: Calculate explainable purchase recommendations for a store
      description: >-
        The backend derives the active organization and current store-local
        operational date. It evaluates active product assortments using the
        previous 30 complete operational dates, excluding only explicitly
        recorded out-of-stock dates. A date without a sale row counts as zero
        only when it falls inside an explicitly declared complete-sales
        period. Fewer than 30 valid dates are marked low evidence. With no
        valid dates, no future consumption is estimated and the effective
        minimum stock is the target; if no minimum is configured, no quantity
        is suggested. Minimum stock and safety days resolve independently by
        store-product, product, category, then network; the review interval
        resolves by store then network. Supplier choice prioritizes avoiding
        predicted shortage, then compares known merchandise unit cost among
        suppliers that arrive in time. Freight, budgets, and expected purchase
        deliveries are not modeled in this increment and are disclosed in the
        response. Access is temporarily administrator-only until store-scoped
        assignments are implemented.
      tags: [Replenishment]
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Current deterministic recommendation snapshot for the store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplenishmentRecommendationList'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
        '409':
          $ref: '#/components/responses/OperationalCalendarRequired'
