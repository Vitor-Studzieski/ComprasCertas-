    parameters:
      - $ref: '#/components/parameters/StoreId'
    get:
      operationId: listStoreSalesCoverage
      summary: List declared complete sales periods for a store
      description: A product/day without a row counts as zero only for dates in these declared complete periods and while the product assortment was active.
      tags: [Replenishment]
      security:
