    SupplierProductConditionCreateRequest:
      type: object
      additionalProperties: false
      required:
        [productId, purchaseUnitName, baseUnitsPerPurchaseUnit, pricePerPurchaseUnit, deliveryLeadTimeDays, minimumPurchaseQuantity, purchaseMultiple, isAvailable, effectiveFrom]
      properties:
        productId:
          type: string
          format: uuid
        storeId:
          type: [string, 'null']
          format: uuid
          description: Omit or send null for a network-wide condition; supply a store UUID for an override.
        purchaseUnitName:
          type: string
          minLength: 1
          maxLength: 40
        baseUnitsPerPurchaseUnit:
          type: string
          maxLength: 15
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,3})?$'
          description: Positive exact decimal; stock base units contained in one purchase unit.
        pricePerPurchaseUnit:
          type: string
          maxLength: 15
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,2})?$'
          description: Exact BRL price per purchase unit; zero or greater.
        deliveryLeadTimeDays:
          type: integer
          minimum: 0
          maximum: 32767
          description: Calendar days.
        minimumPurchaseQuantity:
          type: string
          maxLength: 15
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,3})?$'
          description: Non-negative exact decimal expressed in the purchase unit.
        purchaseMultiple:
          type: string
          maxLength: 15
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,3})?$'
