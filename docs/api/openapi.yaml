            demandWindowStart:
              type: string
              format: date
            demandWindowEnd:
              type: string
              format: date
            excludedOutOfStockDays:
              type: integer
              minimum: 0
            completeSalesDays:
              type: integer
              minimum: 0
            explicitSalesDays:
              type: integer
              minimum: 0
        coverageDays:
          type: [string, 'null']
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        stockDeficit:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        effectiveParameters:
          type: object
          additionalProperties: false
          required: [minimumStock, minimumStockSource, safetyDays, safetyDaysSource, reviewIntervalDays, reviewIntervalSource, source]
          properties:
            minimumStock:
              type: [string, 'null']
              pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,3})?$'
            minimumStockSource:
              type: [string, 'null']
              enum: [store_product, product, category, network, null]
            safetyDays:
              type: [integer, 'null']
              minimum: 0
            safetyDaysSource:
              type: [string, 'null']
              enum: [store_product, product, category, network, null]
            reviewIntervalDays:
              type: [integer, 'null']
              minimum: 1
            reviewIntervalSource:
              type: [string, 'null']
              enum: [store, network, null]
            source:
              type: string
              enum: [store_product, product, category, network, mixed, unconfigured]
        targetStock:
          type: [string, 'null']
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        suggestedQuantity:
          type: [string, 'null']
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
