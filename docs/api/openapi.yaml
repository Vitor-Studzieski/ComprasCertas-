          type: string
          format: uuid
        operationalDate:
          type: string
          format: date
          description: >-
            Store-local business date under the effective timezone and
            operational-day start; it is not a UTC calendar date.
        quantity:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,3})?$'
          description: >-
            Exact nonnegative decimal string. Must be an integer for unit
            products and may have up to three fractional digits for kg/l;
            validation limits beyond precision remain to be aligned with the
            implementation.
        operationId:
          type: string
          format: uuid
          description: Client-generated idempotency key, unique within the active organization.
    DailySale:
      type: object
      additionalProperties: false
      required: [id, storeId, productId, sku, productName, baseUnit, operationalDate, quantity, cutoffDate, stockTreatment, demandEligible, initialStockMovementId, operationId, createdBy, createdAt, correctionCount]
      properties:
        id:
          type: string
          format: uuid
        storeId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        sku:
          type: string
        productName:
          type: string
        baseUnit:
          type: string
          enum: [unit, kg, l]
        operationalDate:
          type: string
          format: date
        quantity:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,3})?$'
          description: Current total after any corrections, in the product's base unit.
        cutoffDate:
          type: string
          format: date
          description: Persisted first full operational date after opening stock was closed.
        stockTreatment:
          type: string
          enum: [demand_only, outbound_movement]
          description: >-
            demand_only applies before cutoffDate; outbound_movement applies
            on or after cutoffDate.
        demandEligible:
          type: boolean
          description: False when the product was outside the demand-eligible assortment period.
        initialStockMovementId:
          type: [string, 'null']
          format: uuid
          description: Initial outbound movement, null for a demand-only total; correction movements are listed on their audit records.
        operationId:
          type: string
          format: uuid
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
          description: Server-generated UTC audit timestamp.
        correctionCount:
          type: integer
          minimum: 0
