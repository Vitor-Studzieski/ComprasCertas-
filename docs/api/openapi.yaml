    DailySaleCreateRequest:
      type: object
      additionalProperties: false
      required: [productId, operationalDate, quantity, operationId]
      properties:
        productId:
          type: string
          format: uuid
        operationalDate:
          type: string
          format: date
          description: >-
            Store-local business date under the effective timezone and
            operational-day start; it is not a UTC calendar date.
        quantity:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,3})?$'
          description: >-
            Exact nonnegative decimal string. Must be an integer for unit
            products and may have up to three fractional digits for kg/l;
            validation limits beyond precision remain to be aligned with the
            implementation.
        operationId:
          type: string
          format: uuid
          description: Client-generated idempotency key, unique within the active organization.
    DailySale:
      type: object
      additionalProperties: false
      required: [id, storeId, productId, sku, productName, baseUnit, operationalDate, quantity, cutoffDate, stockTreatment, demandEligible, initialStockMovementId, operationId, createdBy, createdAt, correctionCount]
      properties:
        id:
          type: string
          format: uuid
        storeId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        sku:
          type: string
        productName:
          type: string
        baseUnit:
          type: string
          enum: [unit, kg, l]
        operationalDate:
          type: string
          format: date
        quantity:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,3})?$'
          description: Current total after any corrections, in the product's base unit.
        cutoffDate:
          type: string
          format: date
          description: Persisted first full operational date after opening stock was closed.
        stockTreatment:
          type: string
          enum: [demand_only, outbound_movement]
          description: >-
            demand_only applies before cutoffDate; outbound_movement applies
            on or after cutoffDate.
        demandEligible:
          type: boolean
          description: False when the product was outside the demand-eligible assortment period.
        initialStockMovementId:
          type: [string, 'null']
          format: uuid
          description: Initial outbound movement, null for a demand-only total; correction movements are listed on their audit records.
        operationId:
          type: string
          format: uuid
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
          description: Server-generated UTC audit timestamp.
        correctionCount:
          type: integer
          minimum: 0
    DailySaleList:
      type: object
      additionalProperties: false
      required: [storeId, operationalDateFrom, operationalDateTo, sales]
      properties:
        storeId:
          type: string
          format: uuid
        operationalDateFrom:
          type: string
          format: date
        operationalDateTo:
          type: string
          format: date
        sales:
          type: array
          items:
            $ref: '#/components/schemas/DailySale'
    DailySaleCorrectionRequest:
      type: object
      additionalProperties: false
      required: [expectedCurrentQuantity, newQuantity, reason, operationId]
      properties:
        expectedCurrentQuantity:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,3})?$'
          description: Exact total last observed by the client; the server compares it under a row lock.
        newQuantity:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,3})?$'
          description: >-
            Replacement total, not a delta. Must be an integer for unit
            products and may have up to three fractional digits for kg/l.
        reason:
          type: string
          minLength: 1
          description: Required human explanation; maximum length and normalization remain provisional.
        operationId:
          type: string
          format: uuid
          description: Client-generated idempotency key, unique within the active organization.
    DailySaleCorrection:
      type: object
      additionalProperties: false
      required: [id, dailySaleId, operationId, previousQuantity, newQuantity, reason, correctedBy, correctedAt, compensatingMovementId]
      properties:
        id:
          type: string
          format: uuid
        dailySaleId:
          type: string
          format: uuid
        operationId:
          type: string
          format: uuid
        previousQuantity:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,3})?$'
        newQuantity:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,3})?$'
        reason:
          type: string
        correctedBy:
          type: string
          format: uuid
        correctedAt:
          type: string
          format: date-time
          description: Server-generated UTC audit timestamp.
        compensatingMovementId:
          type: [string, 'null']
          format: uuid
          description: >-
            Movement created atomically for the net quantity difference when
            the sale date is on or after cutoffDate and the difference is
            nonzero; null otherwise.
    DailySaleCorrectionList:
      type: object
      additionalProperties: false
      required: [dailySaleId, corrections]
      properties:
        dailySaleId:
          type: string
          format: uuid
