        '400':
          description: Invalid range or future operational date.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Problem'
                  - $ref: '#/components/schemas/GenericConflict'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
        '409':
          description: The exact complete period was already declared or the store calendar is missing.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/GenericConflict'
                  - $ref: '#/components/schemas/OperationalCalendarRequired'
  /stores/{storeId}/out-of-stock-days/:
    parameters:
