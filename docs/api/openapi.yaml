      type: object
      additionalProperties: false
      required: [expectedCurrentQuantity, newQuantity, reason, operationId]
      properties:
        expectedCurrentQuantity:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,3})?$'
          description: Exact total last observed by the client; the server compares it under a row lock.
        newQuantity:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,3})?$'
          description: >-
            Replacement total, not a delta. Must be an integer for unit
            products and may have up to three fractional digits for kg/l.
        reason:
          type: string
          minLength: 1
          description: Required human explanation; maximum length and normalization remain provisional.
        operationId:
          type: string
          format: uuid
          description: Client-generated idempotency key, unique within the active organization.
