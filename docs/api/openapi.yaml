        quantityToOrder:
          type: [string, 'null']
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
          description: Final quantity in base units after supplier MOQ and package-multiple rules.
        excessOverTarget:
          type: [string, 'null']
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        selectedSupplierId:
          type: [string, 'null']
          format: uuid
        reasonCodes:
          type: array
          items:
            type: string
        warnings:
