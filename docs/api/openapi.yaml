  /suppliers/{supplierId}/product-conditions/:
    parameters:
      - $ref: '#/components/parameters/SupplierId'
    get:
      operationId: listSupplierProductConditions
      summary: List purchasing conditions for a supplier
      description: >-
        Administrators and buyers only. Conditions are immutable, effective-
        dated versions. With no storeId, administrators receive all scopes and
        buyers receive shared network conditions. Supplying storeId returns
        shared conditions plus that store's overrides; a buyer must have an
        active assignment to the store. Delivery lead time is measured in
        calendar days.
      tags: [Catalog]
      security:
        - SessionCookie: []
      parameters:
        - name: productId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: storeId
          in: query
          required: false
          description: An administrator or buyer assigned to this store may include shared conditions and its overrides.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Purchasing conditions for the supplier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierProductConditionList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/CatalogAccessRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
    post:
      operationId: createSupplierProductCondition
      summary: Add an effective-dated purchasing condition
      description: >-
        Administrators and buyers only. A missing or null storeId creates a
        shared network condition. An administrator or buyer assigned to the
        selected store may supply storeId to create a store override.
        Conditions are
        append-only: effectiveFrom must be later than the latest version for
        the same supplier, product, and scope. Delivery lead time uses
        calendar days. MOQ and purchaseMultiple are expressed in
        purchaseUnitName; baseUnitsPerPurchaseUnit converts that unit into the
        product's stock base unit. Quantities are exact decimal strings, and
        countable products require whole-number conversion and quantities.
      tags: [Catalog]
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierProductConditionCreateRequest'
      responses:
        '201':
          description: New purchasing-condition version created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierProductCondition'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/CatalogAccessRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
        '409':
          $ref: '#/components/responses/SupplierConditionConflict'
  /stores/{storeId}/product-assortments/:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    get:
      operationId: listStoreProductAssortments
      summary: List current and historical store-product links
      description: >-
        A manager, operator, or buyer assigned to this store may read its
        active and historical links. Store ownership and scope are checked
        against the validated active organization. Returns links so ending a
        range never removes its audit history. Validity uses the half-open
        interval [effectiveFrom, effectiveTo): the start is inclusive and the
        optional end is exclusive.
      tags: [Inventory]
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Store-product assortment links and effective dates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreProductAssortmentList'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
    post:
      operationId: createStoreProductAssortment
      summary: Add a product to a store assortment
      description: >-
        Administrator-only. The store and product must both belong to the
        validated active organization. Creates an audited date-effective link
        using [effectiveFrom, effectiveTo), with an optional exclusive end.
        The active organization is derived from the session, not a client ID.
        If effectiveTo is supplied, it must be later than effectiveFrom.
      tags: [Inventory]
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreProductAssortmentCreateRequest'
      responses:
        '201':
          description: Assortment link created with audit metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreProductAssortment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
        '409':
          $ref: '#/components/responses/AssortmentConflict'
  /stores/{storeId}/product-assortments/{assortmentId}/:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/AssortmentId'
    patch:
      operationId: closeStoreProductAssortment
      summary: End a store-product assortment link
      description: >-
        Administrator-only. Sets the exclusive effectiveTo date for an
        open-ended link, retaining the row and its audit history rather than
        deleting it. effectiveTo must be later than effectiveFrom. The server
        verifies the store and link belong to the validated active
        organization and records the acting administrator and server time.
      tags: [Inventory]
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreProductAssortmentCloseRequest'
      responses:
        '200':
          description: Link ended; its historical record is retained.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreProductAssortment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
        '409':
          $ref: '#/components/responses/AssortmentConflict'
  /stores/{storeId}/opening-stock-counts/:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    post:
      operationId: createOpeningStockCount
      summary: Record one atomic opening stock count batch
      description: >-
        Administrator-only. Requires an effective operational calendar for
        both the store's current operational date and closedOperationalDate;
        a future closedOperationalDate is rejected. The server derives
        cutoffDate = closedOperationalDate + 1 operational day. Every line
        must refer to a product in this store's active assortment on
        closedOperationalDate; a complete batch contains one line for every
        product active in the assortment, including explicit zero counts.
        The initial physical count is recorded by an administrator and
        produces immutable audit metadata identifying actor, server time,
        store, closed date, each product/quantity, and the opening movement.
        The server records the origin; this endpoint always records `manual`,
        while a future validated spreadsheet flow may record `spreadsheet`.
        All lines are validated and written atomically; on any error no line
        is committed. Quantities are exact decimal
        strings: unit products require integers, kg/l products allow at most
        three fractional places, and values are never rounded.
      tags: [Inventory]
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpeningStockCountRequest'
      responses:
        '201':
          description: Atomic opening count recorded as ledger movements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpeningStockCount'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
        '409':
          $ref: '#/components/responses/OpeningStockConflict'
  /stores/{storeId}/stock-balances/:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    get:
      operationId: listCurrentStockBalances
      summary: Read current stock balances from movements
      description: >-
        An administrator, manager, operator, or buyer assigned to this store
        may read balances. Requires an effective operational calendar for the
        store's current operational date. Balances are calculated by
        aggregating the store's stock movements; this contract does not
        introduce a separate materialized projection. Quantities are exact
        decimals and follow each product's base-unit precision. Store
        ownership and scope are checked against the validated active organization.
      tags: [Inventory]
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Current ledger-aggregated balances for the store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockBalanceList'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
        '409':
          $ref: '#/components/responses/OperationalCalendarRequired'
  /stores/{storeId}/daily-sales/:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    get:
      operationId: listDailySales
      summary: List daily product sales totals
      description: >-
        Daily totals are scoped to the validated active organization and this
        store. operationalDate is a store-local business date determined by
        the effective time zone and operational-day start; the query dates
        are already operational dates and do not include a client timezone.
        An assigned manager, operator, or buyer may read these records. Reads may be
        used before an opening count and return an empty list when no sales
        exist. Product dates before the opening cutoff are demand-only while
        within the demand-eligible assortment period; records at/after it may
        have created stock movements. Sales after an assortment end may be
        retained for liquidation but are not demand inputs.
      tags: [Sales]
      security:
        - SessionCookie: []
      parameters:
        - name: operationalDateFrom
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: operationalDateTo
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Daily totals for the inclusive store-local operational-date range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailySaleList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/DailySalesAccessRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
        '409':
          $ref: '#/components/responses/OperationalCalendarRequired'
    post:
      operationId: createDailySale
      summary: Record a manual daily sales total
      description: >-
        The organization is derived from the validated active session and the
        store is validated within it; no organizationId is accepted. The
        effective store calendar must resolve for operationalDate. An opening
        stock count must have established the store cutoff before a sale can
        be written. For operationalDate before cutoffDate, the total affects
        demand only and creates no movement. On or after cutoffDate, the total
        and one outbound stock movement are committed atomically. Products
        must belong to this organization and have a store-product link whose
        effectiveFrom is on or before operationalDate. After the link's
        exclusive effectiveTo, explicit sales may still be recorded to
        liquidate residual stock but are not demand-eligible or recommendation
        inputs.

        An operator or manager assigned to this store may create a total.
        Browser writes require CSRF.

        operationId is a client-generated UUID idempotency key. Repeating the
        same operationId with the same canonical payload returns the existing
        sale; reusing it with a different payload returns 409. The unique
        business key is organization + store + SKU + operationalDate; a
        different operationId for an existing key also returns 409.
      tags: [Sales]
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailySaleCreateRequest'
      responses:
        '201':
          description: New daily total recorded; if at/after cutoff, the outbound movement committed atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailySale'
        '200':
          description: Idempotent replay; returns the existing sale resource without duplicating its movement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailySale'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/DailySalesAccessRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
        '409':
          $ref: '#/components/responses/DailySaleWriteConflict'
  /stores/{storeId}/daily-sales/{dailySaleId}/corrections/:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/DailySaleId'
    get:
      operationId: listDailySaleCorrections
      summary: List the audit history of a daily sales total
      description: >-
        An assigned manager, operator, or buyer may read every explicit
        correction in chronological order, preserving
        the previous and new totals, actor, reason, server timestamp, and any
        compensating movement. Authorization is scoped to this store.
      tags: [Sales]
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Correction audit history for the daily sale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailySaleCorrectionList'
        '403':
          $ref: '#/components/responses/DailySalesAccessRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
    post:
      operationId: correctDailySale
      summary: Explicitly correct a daily sales total
      description: >-
        Replaces the current daily total and appends an immutable correction
        audit record; it does not create a second daily-sale row. The request
        must include expectedCurrentQuantity from the screen's latest read.
        After idempotent replay lookup, the backend locks the sale and rejects
        a correction if its current quantity no longer matches that expected
        value. The actor and server time are derived and recorded by the
        backend, while reason is required in the request. The effective store
        calendar and an existing opening cutoff are required. If
        operationalDate is before cutoffDate, the correction changes demand
        data only. On/after cutoffDate, the correction and a compensating
        stock movement for the difference only are committed in the same
        transaction. Retrying the same operationId with the same payload
        returns the existing correction; reusing that ID with a different
        payload returns 409. A store-assigned operator or manager may correct
        the total. Browser writes require CSRF.
      tags: [Sales]
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailySaleCorrectionRequest'
      responses:
        '201':
          description: Correction recorded with old/new values and audit metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailySaleCorrection'
        '200':
          description: Idempotent replay; returns the existing correction without duplicating its movement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailySaleCorrection'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/DailySalesAccessRequired'
        '404':
          $ref: '#/components/responses/StoreScopedNotFound'
        '409':
          $ref: '#/components/responses/DailySaleCorrectionConflict'

  /imports/templates/{kind}/:
    get:
      operationId: downloadImportTemplate
      summary: Download an exact CSV or XLSX import template
      tags: [Imports]
      security: []
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ImportKind'
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [csv, xlsx]
            default: csv
      responses:
        '200':
          description: Header-only spreadsheet template.
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '404':
          description: Import kind does not exist.
  /imports/previews/:
    post:
      operationId: createSpreadsheetImportPreview
      summary: Validate a full spreadsheet without applying its rows
      description: |
        Multipart upload. Supported kinds are products, suppliers, conditions,
        opening_stock, daily_sales, and out_of_stock_days. The import is
        organization-scoped. Catalog and condition imports are for network
        administrators/buyers; inventory history imports are for
        administrators or assigned store managers/operators. Product updates
        never modify stock, and base-unit changes are rejected. Opening stock
        must include exactly every active assortment item, including zeroes.
        Daily sales must declare a complete date range; omitted SKU/date rows
        in that period represent zero only while the product is active in the
        store assortment. The uploaded file is not applied by this operation.
      tags: [Imports]
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportPreviewRequest'
      responses:
        '201':
          description: Whole-file validation result and change preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchPreview'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: Role or assigned store scope does not allow this import.
        '404':
          $ref: '#/components/responses/ActiveOrganizationRequired'
  /imports/previews/{batchId}/:
    get:
      operationId: getSpreadsheetImportPreview
      summary: Read a preview created by the current user
      tags: [Imports]
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ImportBatchId'
      responses:
        '200':
          description: Current preview and its state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchPreview'
        '404':
          description: Preview is unavailable in the active organization.
  /imports/previews/{batchId}/confirm/:
    post:
      operationId: confirmSpreadsheetImport
      summary: Revalidate and atomically apply a complete spreadsheet import
      description: |
        Only the user who created the preview may confirm it. All affected
        records are revalidated before any write. If the target data changed,
        the response is 409 with a refreshed preview and no rows are applied.
        A preview expires after 30 minutes and may be confirmed only once.
      tags: [Imports]
      security:
        - SessionCookie: []
          CsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ImportBatchId'
      responses:
        '200':
          description: Every valid row was applied in one transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchPreview'
        '403':
          description: Role or assigned store scope no longer allows this import.
        '404':
          description: Preview is unavailable in the active organization.
        '409':
          description: Stale preview, invalid rows, or an already confirmed batch; no partial write occurs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportProblem'
        410:
          description: The preview expired before confirmation.
          content:
            application/json:
              schema:
                $ref: #/components/schemas/ImportProblem
